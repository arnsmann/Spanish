  add('vs','Indefinido or imperfecto?','The classic decision','<p>Think of a film. The <b>imperfecto</b> is the setting and the background. The <b>indefinido</b> is the events that move the story forward.</p>'+gTbl(['Imperfecto','Indefinido'],[['Habit, repeated: <i>Iba al club cada día.</i>','One time, finished: <i>Fui al club ayer.</i>'],['Description, feelings: <i>Hacía sol, estaba contento.</i>','Change or reaction: <i>Se puso contento.</i>'],['Action in progress: <i>Leía cuando sonó el teléfono.</i>','Interrupting event: <i>Sonó el teléfono.</i>'],['Age, time, weather: <i>Eran las tres.</i>','Exact duration: <i>Viví allí dos años.</i>']])+
   '<p>Both in one sentence:</p>'+gE('Cuando llegué, mi hermana dormía.','When I arrived, my sister was sleeping.')+gE('Estaba en casa cuando me llamó Ana.','I was at home when Ana called me.')+
   '<p><b>Verbs that change meaning:</b></p>'+gTbl(['Verb','Imperfecto','Indefinido'],[['saber','sabía: I knew','supe: I found out'],['conocer','conocía: I knew (a person)','conocí: I met'],['querer','quería: I wanted','quise: I tried; no quise: I refused'],['poder','podía: I was able','pude: I managed to']]));

  add('plusc','Pretérito pluscuamperfecto','había hablado','<p>Formed with the imperfect of <b>haber</b> plus the participle. It describes an action that happened before another moment in the past.</p>'+gModel('plusc',['hablar'])+gE('Cuando llegué, ya se había ido.','When I arrived, he had already left.')+gE('Nunca había visto el mar.','I had never seen the sea.')+gE('Me dijo que había terminado.','He told me that he had finished.')+'<p class="mu">Signal words: ya, todavía no, nunca, antes de, cuando.</p>');

  add('fut','Futuro simple','hablaré, tendré','<p>Add the endings to the <b>whole infinitive</b>. The same endings are used for all verbs.</p>'+gModel('fut')+
   '<p><b>Irregular stems</b> (endings stay the same):</p>'+gTbl(['Infinitive','Stem','Infinitive','Stem'],[['tener','tendr','poder','podr'],['venir','vendr','querer','querr'],['poner','pondr','saber','sabr'],['salir','saldr','haber','habr'],['valer','valdr','caber','cabr'],['hacer','har','decir','dir']])+
   '<p><b>Uses.</b> Plans and predictions, promises, and guesses about the present.</p>'+gE('Mañana lloverá en el norte.','Tomorrow it will rain in the north.')+gE('Te llamaré luego.','I will call you later.')+gE('¿Dónde estará Ana? Estará en casa.','Where could Ana be? She is probably at home.')+
   '<p><b>Near future with ir a:</b> <i>voy a estudiar, vas a ver, va a llover</i>. It is the usual way to talk about plans in spoken Spanish.</p>'+
   '<p class="mu">Signal words: mañana, el año que viene, pronto, dentro de dos días, algún día.</p>');

  add('futperf','Futuro perfecto','habré hablado','<p>Future of <b>haber</b> plus the participle. It means that something will be finished by a certain future moment, or it guesses about the past.</p>'+gModel('futperf',['hablar'])+gE('Para mañana ya habré terminado.','By tomorrow I will have finished.')+gE('Habrá llegado ya.','He has probably arrived already.')+'<p class="mu">Signal words: para entonces, antes de, dentro de, ya.</p>');

  add('cond','Condicional simple','hablaría, tendría','<p>Same stem as the future, with the endings of the imperfect of -er/-ir verbs.</p>'+gModel('cond')+
   '<p>Irregular stems are the same as in the future: tendría, podría, haría, diría, saldría, vendría, querría, sabría.</p>'+
   '<p><b>Uses.</b></p>'+gE('Me gustaría un café.','I would like a coffee.')+gE('¿Podrías ayudarme?','Could you help me?')+gE('Yo que tú, hablaría con ella.','If I were you, I would talk to her.')+gE('Dijo que vendría mañana.','He said he would come tomorrow.')+gE('Serían las tres cuando llegó.','It must have been three when he arrived.')+
   '<p class="mu">Often used with deber, poder, querer for polite or soft statements: <i>Deberías descansar.</i></p>');

  add('condperf','Condicional compuesto','habría hablado','<p>Conditional of <b>haber</b> plus the participle. It means would have.</p>'+gModel('condperf',['hablar'])+gE('Yo habría hecho lo mismo.','I would have done the same.')+gE('Me habría gustado ir.','I would have liked to go.')+gE('Si hubiera sabido, habría venido.','If I had known, I would have come.'));

  add('sprs','Subjuntivo presente','Wishes, doubts, emotions','<p><b>Formation.</b> Take the yo form of the present, drop the -o, and add the opposite vowel: -ar verbs take -e, -er and -ir verbs take -a.</p>'+gModel('sprs')+
   '<p>This explains the irregulars: tener (tengo) gives tenga, conocer (conozco) gives conozca, decir (digo) gives diga, hacer (hago) gives haga. Stem changers keep the boot: pensar gives piense but pensemos. In -ir verbs nosotros also changes: durmamos, pidamos, sintamos.</p>'+
   '<p><b>Irregular:</b></p>'+gModel('sprs',['ser','estar','ir'])+
   gTbl(['Infinitive','Subjunctive'],[['haber','haya, hayas, haya, hayamos, hayáis, hayan'],['saber','sepa, sepas, sepa, sepamos, sepáis, sepan'],['dar','dé, des, dé, demos, deis, den'],['ver','vea, veas, vea, veamos, veáis, vean']])+
   '<p><b>When to use it.</b> When there are two parts joined by <b>que</b> with different subjects, and the first part expresses something other than a fact. Think of WEIRDO:</p>'+
   gTbl(['','Trigger','Example'],[['W','Wishes, wants: querer, desear, esperar, ojalá','Quiero que vengas.'],['E','Emotions: alegrarse, temer, me gusta que','Me alegro de que estés aquí.'],['I','Impersonal expressions: es importante que, es posible que','Es importante que estudies.'],['R','Recommendations, orders, requests: pedir, aconsejar, sugerir, permitir','Te pido que me ayudes.'],['D','Doubt, denial: dudar, no creer, no pensar, no es verdad que','No creo que sea fácil.'],['O','Ojalá','Ojalá llueva mañana.']])+
   '<p><b>Compare:</b></p>'+gE('Creo que viene.','I think he is coming. (fact, indicative)')+gE('No creo que venga.','I do not think he is coming. (doubt, subjunctive)')+
   '<p><b>Same subject means infinitive:</b> <i>Quiero comer</i> but <i>Quiero que comas</i>.</p>'+
   '<p><b>Conjunctions that always take the subjunctive:</b> para que, antes de que, sin que, a menos que, con tal de que, en caso de que.</p>'+
   '<p><b>Conjunctions that take it for future or unknown events:</b> cuando, en cuanto, hasta que, después de que, aunque, donde, como.</p>'+
   gE('Cuando llegues, llámame.','When you arrive, call me.')+gE('Cuando llego, siempre ceno.','When I arrive, I always have dinner. (habit, indicative)')+gE('Busco un piso que tenga balcón.','I am looking for a flat that has a balcony. (unknown)'));

  add('sperf','Subjuntivo perfecto','haya hablado','<p>Present subjunctive of <b>haber</b> plus the participle. Use it when the action is already finished or seen from the future.</p>'+gModel('sperf',['hablar'])+gE('Espero que hayas dormido bien.','I hope you slept well.')+gE('No creo que haya llegado todavía.','I do not think he has arrived yet.')+gE('Cuando hayas terminado, avísame.','When you have finished, tell me.'));

  add('simp','Subjuntivo imperfecto','hablara, tuviera','<p><b>Formation.</b> Take the ellos form of the indefinido, drop -ron, and add -ra, -ras, -ra, -ramos, -rais, -ran. Nosotros gets an accent on the vowel before -ramos.</p>'+gModel('simp')+
   '<p>Every verb that is irregular in the indefinido carries that over: tuviera, hiciera, dijera, fuera, pudiera, durmiera, leyera.</p>'+
   '<p>The same forms exist with -se (hablase, hablases, hablase, hablásemos, hablaseis, hablasen). Both mean the same, the -ra form is more common.</p>'+
   '<p><b>Uses.</b></p>'+gE('Quería que vinieras.','I wanted you to come. (past main verb)')+gE('Me gustaría que me ayudaras.','I would like you to help me. (conditional main verb)')+gE('Si tuviera tiempo, viajaría más.','If I had time, I would travel more.')+gE('Ojalá tuviera más tiempo.','I wish I had more time.')+gE('Quisiera un café, por favor.','I would like a coffee, please. (polite)')+
   '<p><b>Sequence of tenses:</b></p>'+gTbl(['Main verb','Subjunctive in que clause'],[['Present, future, imperative, perfecto','Present subjunctive (or perfecto)'],['Indefinido, imperfecto, condicional, pluscuamperfecto','Imperfect subjunctive']]));

  add('splus','Subjuntivo pluscuamperfecto','hubiera hablado','<p>Imperfect subjunctive of <b>haber</b> plus the participle. It talks about unreal things in the past.</p>'+gModel('splus',['hablar'])+gE('Si hubiera estudiado más, habría aprobado.','If I had studied more, I would have passed.')+gE('Ojalá hubiera venido.','I wish he had come.')+gE('Me habría gustado que hubieras estado allí.','I would have liked you to have been there.'));

  add('si','Si clauses (conditionals)','Real and unreal conditions','<p>The tense after <i>si</i> decides the type. Never use the present subjunctive or the future directly after si.</p>'+gTbl(['Type','si part','Result part','Example'],[['Real, possible','Presente','Presente, futuro or imperativo','Si llueve, me quedo en casa.'],['Unlikely or unreal now','Imperfecto de subjuntivo','Condicional','Si tuviera dinero, compraría una casa.'],['Impossible, past','Pluscuamperfecto de subjuntivo','Condicional compuesto','Si hubiera sabido, habría venido.'],['Mixed','Pluscuamperfecto de subjuntivo','Condicional','Si hubiera estudiado, ahora tendría un buen trabajo.']])+gE('Si quieres, te ayudo.','If you want, I will help you.')+gE('Si fuera tú, hablaría con él.','If I were you, I would talk to him.')+gE('Como si no pasara nada.','As if nothing were happening.'));

  add('imp','Imperativo','Commands and instructions','<p><b>Affirmative.</b> Tú uses the él form of the present. Usted, nosotros and ustedes use the subjunctive. Vosotros replaces the final -r of the infinitive with -d.</p>'+gModel('impa')+
   '<p><b>Negative.</b> Always no plus the subjunctive, for every person.</p>'+gModel('impn')+
   '<p><b>Irregular tú forms</b> (affirmative only):</p>'+gTbl(['Infinitive','tú','Infinitive','tú'],[['decir','di','salir','sal'],['hacer','haz','ser','sé'],['ir','ve','tener','ten'],['poner','pon','venir','ven']])+
   '<p><b>Pronouns.</b> They attach to an affirmative command and go before a negative one. An accent keeps the stress where it was.</p>'+gE('Dímelo.','Tell it to me.')+gE('No me lo digas.','Do not tell it to me.')+gE('Siéntate.','Sit down.')+gE('No te sientes aquí.','Do not sit here.')+gE('Vámonos.','Let us go.')+
   '<p class="mu">Vamos is the affirmative nosotros form of ir (let us go). The negative uses the subjunctive: no vayamos. With reflexive verbs, the practice tab only asks for the negative form.</p>');

  add('ger','Gerundio','hablando, comiendo, viviendo','<p>-ar verbs take -ando, -er and -ir verbs take -iendo. After a vowel, i becomes y.</p>'+gTbl(['Verb','Gerundio','Rule'],[['hablar','hablando','regular'],['comer','comiendo','regular'],['leer','leyendo','vowel stem'],['construir','construyendo','vowel stem'],['ir','yendo','irregular'],['dormir','durmiendo','-ir stem change'],['pedir','pidiendo','-ir stem change'],['decir','diciendo','-ir stem change'],['venir','viniendo','-ir stem change'],['poder','pudiendo','irregular']])+
   '<p><b>Uses.</b> Estar plus gerundio for actions in progress. Seguir, llevar, ir, venir plus gerundio for ongoing actions.</p>'+gE('Estoy estudiando.','I am studying.')+gE('Sigue lloviendo.','It is still raining.')+gE('Llevo dos horas esperando.','I have been waiting for two hours.')+gE('Vamos mejorando poco a poco.','We are improving little by little.')+
   '<p>Pronouns go before estar or attach to the gerundio: <i>Me estoy lavando</i> or <i>Estoy lavándome</i>.</p>');

  add('part','Participio','Perfect tenses, adjectives, passive','<p>Regular: -ado and -ido. Irregular ones are listed under Pretérito perfecto (abierto, dicho, escrito, hecho, puesto, roto, visto, vuelto, muerto, cubierto, resuelto).</p>'+
   '<p>With haber the participle never changes. As an adjective it agrees with the noun.</p>'+gE('He cerrado la puerta.','I have closed the door.')+gE('La puerta está cerrada.','The door is closed. (result)')+gE('La carta fue escrita por Ana.','The letter was written by Ana. (passive with ser)')+gE('Tengo escritas tres páginas.','I have three pages written.'));

  add('pron','Pronoun overview','All pronoun types side by side','<p>Which pronoun to use depends on its job in the sentence.</p>'+gTbl(['Person','Subject','Direct object','Indirect object','Reflexive','After preposition'],[['1st sing.','yo','me','me','me','mí, conmigo'],['2nd sing.','tú','te','te','te','ti, contigo'],['3rd sing.','él, ella, usted','lo, la','le (se)','se','él, ella, usted, sí'],['1st pl.','nosotros','nos','nos','nos','nosotros'],['2nd pl.','vosotros','os','os','os','vosotros'],['3rd pl.','ellos, ellas, ustedes','los, las','les (se)','se','ellos, ellas, ustedes, sí']])+
   '<p>Subject pronouns are usually left out because the verb ending shows the person. Use them for emphasis or contrast: <i>Yo trabajo, tú descansas.</i></p>'+
   '<p>After most prepositions use mí and ti, but with con: <i>conmigo, contigo, consigo</i>. Entre, según, excepto, salvo and incluso take the subject forms: <i>entre tú y yo</i>.</p>');

  add('dop','Direct object pronouns','lo, la, los, las, me, te, nos, os','<p>The direct object answers <b>what?</b> or <b>whom?</b>. The pronoun replaces it and agrees in gender and number with the noun.</p>'+gE('Veo la película. → La veo.','I see the film. → I see it.')+gE('Compro los libros. → Los compro.','I buy the books. → I buy them.')+gE('Conozco a Pedro. → Lo conozco.','I know Pedro. → I know him.')+gE('¿Me oyes? Sí, te oigo.','Can you hear me? Yes, I hear you.')+
   '<p>For people, Spain often uses <i>le</i> instead of <i>lo</i> for a man (<i>Le veo</i>). Both are accepted. <i>Lo</i> can also stand for an idea: <i>Lo sé.</i> (I know it.)</p>');

  add('iop','Indirect object pronouns','me, te, le, nos, os, les','<p>The indirect object answers <b>to whom?</b> or <b>for whom?</b>. Typical verbs: dar, decir, escribir, regalar, enviar, mandar, explicar, prestar, pedir, preguntar, contar, ofrecer, mostrar, comprar, traer.</p>'+gTbl(['Person','Pronoun','Example'],[['to me','me','Me das el libro.'],['to you','te','Te escribo una carta.'],['to him, her, you (usted)','le','Le explico la regla a Ana.'],['to us','nos','Nos cuenta una historia.'],['to you all (vosotros)','os','Os traigo un regalo.'],['to them, you all (ustedes)','les','Les digo la verdad a mis padres.']])+
   '<p><b>Doubling.</b> In Spanish the indirect pronoun is normally used even when the person is named. Both are present: <i>Le doy el libro a María.</i> Without the pronoun it sounds wrong. For emphasis or clarity add <i>a mí, a ti, a él, a ella, a usted, a nosotros, a ellos</i>: <i>A mí me gusta, a ti no.</i></p>'+
   gE('Le compré flores a mi madre.','I bought flowers for my mother.')+gE('¿Les has dicho algo a los vecinos?','Have you told the neighbours anything?')+gE('Me han robado la cartera.','Someone stole my wallet (from me).'));

  add('order','Pronoun order and placement','me lo, se lo, dártelo','<p><b>Order:</b> reflexive, then indirect, then direct (RID). Both come before the conjugated verb, in this order: me/te/nos/os, then lo/la/los/las.</p>'+gE('Me lo das.','You give it to me.')+gE('Te las envío.','I send them to you.')+gE('Nos lo explica.','He explains it to us.')+
   '<p><b>le or les before lo, la, los, las becomes se.</b> Two l sounds are not allowed next to each other.</p>'+gE('Le doy el libro. → Se lo doy.','I give him the book. → I give it to him.')+gE('Les escribo la carta. → Se la escribo.','I write the letter to them. → I write it to them.')+
   '<p><b>Placement.</b></p>'+gTbl(['Verb form','Position','Example'],[['Conjugated verb','before','Me lo dice.'],['Infinitive','before the conjugated verb or attached','Te lo quiero dar. / Quiero dártelo.'],['Gerundio','before estar or attached','Me lo estás diciendo. / Estás diciéndomelo.'],['Affirmative command','attached','Dímelo. Dáselo.'],['Negative command','before','No me lo digas.'],['Perfect tenses','before haber','Me lo ha dicho.']])+
   '<p>When attaching, add an accent to keep the stress: <i>dar → dármelo, diciendo → diciéndomelo, da → dámelo</i>.</p>');

  add('refl','Reflexive verbs','levantarse, me levanto','<p>The action returns to the subject. The pronoun matches the subject: me, te, se, nos, os, se.</p>'+gModel('pres',['levantarse','llamarse','irse'])+
   '<p>Common reflexive verbs: levantarse, acostarse, ducharse, vestirse, lavarse, despertarse, sentarse, quedarse, llamarse, sentirse, divertirse, irse, ponerse (to put on), quitarse (to take off), acordarse de, olvidarse de.</p>'+
   '<p><b>Reciprocal</b> (each other, plural only): <i>Nos vemos mañana. Se quieren mucho.</i></p>'+
   '<p><b>Meaning changes:</b> ir (go) and irse (leave), dormir (sleep) and dormirse (fall asleep), poner (put) and ponerse (put on, become), llamar (call) and llamarse (be called).</p>'+
   gE('Me lavo las manos.','I wash my hands. (use el, la, los, las with body parts and clothes, not mi)')+gE('Se cayó el vaso.','The glass fell. (accidental se)'));

  add('gust','gustar and similar verbs','Me gusta, me duele, me encanta','<p>The thing you like is the <b>subject</b>, the person is the <b>indirect object</b>. The verb agrees with the thing, not with the person.</p>'+gTbl(['Person','Pronoun','Verb','Thing liked'],[['(A mí)','me','gusta','el café / bailar'],['(A ti)','te','gusta','la música'],['(A él, ella, usted)','le','gusta','este libro'],['(A nosotros)','nos','gustan','los gatos'],['(A vosotros)','os','gustan','las películas'],['(A ellos, ustedes)','les','gustan','los deportes']])+
   '<p>Singular or an infinitive uses <i>gusta</i>. Plural uses <i>gustan</i>.</p>'+gE('Me gusta el té y me gustan las galletas.','I like tea and I like biscuits.')+gE('A mí me encanta correr, a ti no.','I love running, you do not.')+
   '<p><b>Similar verbs:</b> encantar (love), fascinar, interesar, molestar (bother), importar (matter), parecer (seem), doler (hurt), faltar (be missing), quedar (be left), sobrar (be more than enough), apetecer (feel like), preocupar, aburrir, dar miedo, dar igual.</p>'+
   gE('Me duele la cabeza.','My head hurts.')+gE('Nos falta tiempo.','We lack time.')+gE('¿Te apetece un café?','Do you feel like a coffee?')+gE('Me pareció interesante.','It seemed interesting to me.')+gE('Me gustaría ir.','I would like to go.'));

  add('ind','Indirect speech (estilo indirecto)','Reporting what someone said','<p>You report what someone said with <b>que</b> (statements), <b>si</b> (yes or no questions) or the question word (other questions). If the reporting verb is in the <b>past</b> (dijo, preguntó, explicó), the tense usually moves one step back.</p>'+
   gTbl(['Direct speech','Indirect speech'],[['Presente<br><i>«Estoy cansado.»</i>','Imperfecto<br><i>Dijo que estaba cansado.</i>'],['Pretérito perfecto<br><i>«He terminado.»</i>','Pluscuamperfecto<br><i>Dijo que había terminado.</i>'],['Indefinido<br><i>«Llegué ayer.»</i>','Pluscuamperfecto (indefinido is also heard)<br><i>Dijo que había llegado el día anterior.</i>'],['Imperfecto<br><i>«Vivía en Lima.»</i>','Imperfecto (no change)<br><i>Dijo que vivía en Lima.</i>'],['Futuro simple<br><i>«Vendré mañana.»</i>','Condicional<br><i>Dijo que vendría al día siguiente.</i>'],['Futuro perfecto<br><i>«Habré terminado.»</i>','Condicional compuesto<br><i>Dijo que habría terminado.</i>'],['Condicional<br><i>«Me gustaría ir.»</i>','Condicional (no change)<br><i>Dijo que le gustaría ir.</i>'],['Imperativo<br><i>«Ven aquí.»</i>','Subjuntivo imperfecto<br><i>Me dijo que viniera allí.</i>'],['Subjuntivo presente<br><i>«Quiero que vengas.»</i>','Subjuntivo imperfecto<br><i>Dijo que quería que viniera.</i>']])+
   '<p><b>Questions.</b></p>'+gE('«¿Tienes hambre?» → Me preguntó si tenía hambre.','He asked me if I was hungry.')+gE('«¿Dónde vives?» → Me preguntó dónde vivía.','He asked me where I lived.')+gE('«¿Qué haces?» → Preguntó qué hacía.','He asked what I was doing. (no question marks, the accent on qué stays)')+
   '<p><b>Commands and requests</b> become que plus subjunctive. Verbs: decir, pedir, ordenar, mandar, aconsejar, sugerir, rogar.</p>'+gE('«Cierra la puerta.» → Me pidió que cerrara la puerta.','He asked me to close the door.')+gE('«No hables.» → Me dijo que no hablara.','He told me not to speak.')+
   '<p><b>Words that change with the point of view:</b></p>'+gTbl(['Direct','Indirect'],[['hoy','ese día'],['ayer','el día anterior, la víspera'],['mañana','al día siguiente'],['ahora','entonces'],['esta semana','aquella semana'],['el año pasado','el año anterior'],['hace dos días','dos días antes'],['aquí','allí'],['este, esta','ese, esa, aquel, aquella'],['yo, mi, mío','él o ella, su, suyo'],['venir (ven)','ir (fuera)']])+
   '<p><b>No step back</b> when the reporting verb is present, perfecto or future, or when it is happening right now:</p>'+gE('Dice que está cansado.','He says he is tired.')+gE('Ha dicho que vendrá mañana.','He has said he will come tomorrow.')+
   '<p>Other reporting verbs: contestar, explicar, comentar, afirmar, añadir, contar, prometer (que plus condicional or an infinitive), confesar, negar.</p>'+gE('Prometió que me llamaría.','He promised he would call me.')+gE('Prometió llamarme.','He promised to call me.'));

  add('ser','ser or estar?','Two verbs for to be','<p>Ser is for <b>what something is</b>. Estar is for <b>how or where something is</b>.</p>'+gTbl(['SER','ESTAR'],[['Identity, profession, origin: <i>Soy Arne. Soy tenista. Soy de Colonia.</i>','Location (things and people): <i>Estoy en casa. Bonn está en Alemania.</i>'],['Characteristics: <i>Es alto. Es una ciudad bonita.</i>','Temporary state, mood: <i>Estoy cansado. Está enfadada.</i>'],['Time, date, price: <i>Son las tres. Hoy es lunes.</i>','Ongoing action: <i>Estoy comiendo.</i>'],['Material, possession: <i>Es de madera. Es de Ana.</i>','Result of an action: <i>La puerta está abierta.</i>'],['Events: <i>La fiesta es en mi casa.</i>','With bien and mal: <i>Estoy bien.</i>'],['Passive voice: <i>Fue escrito por Ana.</i>','']])+
   '<p><b>Meaning changes with the verb:</b></p>'+gTbl(['Adjective','with ser','with estar'],[['aburrido','boring','bored'],['listo','clever','ready'],['malo','bad (a bad person)','ill'],['rico','rich','tasty'],['seguro','safe','sure'],['verde','green','unripe'],['abierto','open-minded','open'],['orgulloso','proud (arrogant)','proud (of something)']]));

  add('porpara','por or para?','Two prepositions for for','<p><b>Para</b> looks forward: purpose, goal, destination, deadline, recipient. <b>Por</b> looks back or through: cause, reason, exchange, duration, movement through a place, agent.</p>'+gTbl(['PARA','POR'],[['Purpose: <i>Estudio para aprobar.</i>','Cause, reason: <i>Lo hice por ti.</i>'],['Destination: <i>Salgo para Madrid.</i>','Movement through: <i>Paseo por el parque.</i>'],['Deadline: <i>Es para el lunes.</i>','Duration, time of day: <i>por la mañana, por dos semanas</i>'],['Recipient: <i>Un regalo para ti.</i>','Exchange, price: <i>Lo compré por diez euros.</i>'],['Opinion: <i>Para mí, es difícil.</i>','Agent in passive: <i>escrito por Ana</i>'],['Comparison: <i>Para un niño, es alto.</i>','Frequency, rate: <i>tres veces por semana</i>'],['Employment: <i>Trabajo para una empresa.</i>','Fixed phrases: por favor, por supuesto, por eso, por fin, por ejemplo']])+
   gE('Gracias por la ayuda.','Thanks for the help.')+gE('Estoy aquí para ayudarte.','I am here to help you.')+gE('Estoy a punto de salir.','I am about to leave.'));

  add('q','Question words and exclamations','Qué, cuál, quién, dónde...','<p>All question words carry an accent, also in indirect questions: <i>No sé dónde vive.</i></p>'+gTbl(['Word','Meaning','Example'],[['qué','what','¿Qué quieres?'],['cuál, cuáles','which (one)','¿Cuál prefieres?'],['quién, quiénes','who','¿Quién es?'],['dónde, adónde','where, where to','¿Adónde vas?'],['cuándo','when','¿Cuándo llegas?'],['cómo','how','¿Cómo estás?'],['cuánto, cuánta, cuántos, cuántas','how much, how many','¿Cuántos años tienes?'],['por qué','why','¿Por qué lloras?'],['para qué','what for','¿Para qué sirve?'],['de quién','whose','¿De quién es?']])+
   '<p><b>Qué or cuál?</b> Qué asks for a definition or a choice before a noun (<i>¿Qué libro?</i>). Cuál chooses among a known group (<i>¿Cuál es tu número?</i>).</p>'+
   '<p><b>Exclamations:</b> <i>¡Qué bonito! ¡Qué suerte! ¡Cuánto tiempo! ¡Cómo llueve!</i></p>'+
   '<p>Spanish questions and exclamations start with an upside down mark: ¿ and ¡.</p>');

  add('comp','Comparisons and superlatives','más que, tan como, el más','<p>Comparisons with <i>más</i> and <i>menos</i> use <b>que</b>. Equal comparisons use <b>tan... como</b> (adjectives) and <b>tanto... como</b> (nouns, verbs).</p>'+gE('Ana es más alta que yo.','Ana is taller than me.')+gE('Estudio menos que tú.','I study less than you.')+gE('Soy tan rápido como él.','I am as fast as him.')+gE('Tengo tantos libros como tú.','I have as many books as you.')+gE('Más de diez personas.','More than ten people. (de with numbers)')+
   '<p><b>Irregular:</b> bueno, mejor; malo, peor; grande, mayor (older, bigger); pequeño, menor (younger, smaller); bien, mejor; mal, peor.</p>'+
   '<p><b>Superlative:</b> el más, la menos, los mejores plus <b>de</b>: <i>Es el más alto de la clase.</i> With -ísimo: <i>buenísimo, altísimo, riquísimo</i> (very, very).</p>');

  add('neg','Negation and indefinite words','nada, nadie, nunca, ningún','<p>Spanish uses double negatives. If a negative word comes after the verb, put <b>no</b> before the verb. If it comes before the verb, drop the no.</p>'+gTbl(['Positive','Negative'],[['algo, something','nada, nothing'],['alguien, someone','nadie, nobody'],['siempre, always','nunca, jamás, never'],['también, also','tampoco, neither'],['algún, alguno, alguna','ningún, ninguno, ninguna'],['o... o, either or','ni... ni, neither nor'],['ya, already','todavía no, aún no, not yet']])+
   gE('No veo a nadie.','I do not see anybody.')+gE('Nadie lo sabe.','Nobody knows it.')+gE('No tengo ningún problema.','I have no problem.')+gE('Yo tampoco.','Me neither.')+gE('No quiero ni café ni té.','I want neither coffee nor tea.'));

  add('verbs','Useful verb pairs and phrases','saber and conocer, hace, acabar de','<p><b>Saber or conocer.</b> Saber is knowing facts or how to do something. Conocer is being familiar with a person, place or thing.</p>'+gE('Sé hablar español.','I know how to speak Spanish.')+gE('Conozco a tu hermana.','I know your sister.')+
   '<p><b>Obligation:</b> tener que plus infinitive (personal duty), hay que (general rule), deber (moral duty).</p>'+gE('Tengo que estudiar.','I have to study.')+gE('Hay que comer bien.','One has to eat well.')+
   '<p><b>Time:</b></p>'+gE('Hace dos años que vivo aquí.','I have lived here for two years.')+gE('Vivo aquí desde hace dos años.','I have lived here for two years.')+gE('Llegué hace una hora.','I arrived an hour ago.')+
   '<p><b>With infinitives:</b></p>'+gTbl(['Phrase','Meaning','Example'],[['acabar de','to have just','Acabo de llegar.'],['volver a','to do again','Vuelvo a intentarlo.'],['dejar de','to stop','Dejó de fumar.'],['empezar a','to begin to','Empiezo a entender.'],['seguir plus gerundio','to keep on','Sigo estudiando.'],['soler','to usually','Suelo levantarme temprano.'],['ir a','to be going to','Voy a salir.'],['tardar en','to take time','Tardo una hora en llegar.']]));

  add('prep','Verbs with prepositions','pensar en, soñar con, depender de','<p>Many verbs need a fixed preposition. Learn them together:</p>'+gTbl(['with a','with de','with en','with con','with por'],[['ayudar a','acordarse de','pensar en','soñar con','preocuparse por'],['empezar a','olvidarse de','confiar en','contar con','interesarse por'],['aprender a','depender de','insistir en','casarse con','votar por'],['ir a','tratar de','fijarse en','encontrarse con','luchar por'],['volver a','enamorarse de','quedar en','tropezar con','']])+
   gE('Pienso en ti.','I think of you.')+gE('Sueño con viajar.','I dream of travelling.')+gE('Me olvidé de la llave.','I forgot the key.')+gE('Dependo de ti.','I depend on you.')+
   '<p><b>Personal a.</b> Put <b>a</b> before a specific person (or pet) that is the direct object: <i>Veo a Ana. Busco a mi perro.</i> Not before things, and not after tener.</p>');

  add('acc','Accents and stress','Where the written accent goes','<p>Stress rule in one line: words ending in a vowel, n or s are stressed on the second to last syllable (<i>hablo, hablan</i>). Words ending in any other consonant are stressed on the last syllable (<i>hablar, ciudad</i>). Any exception gets a written accent: <i>habló, estación, árbol</i>.</p>'+
   '<p><b>Accents that change the meaning:</b></p>'+gTbl(['no accent','accent'],[['el, the','él, he'],['tu, your','tú, you'],['mi, my','mí, me (after a preposition)'],['si, if','sí, yes'],['se, reflexive pronoun','sé, I know or be (command)'],['te, you (object)','té, tea'],['mas, but (rare)','más, more'],['de, of','dé, give (subjunctive)'],['que, that','qué, what']])+
   '<p>Accents also separate tenses: <i>hablo</i> (I speak), <i>habló</i> (he spoke), <i>hablé</i> (I spoke), <i>hable</i> (subjunctive).</p>');

  return T;
}

// ===== Spanish grammar: tab (reference, conjugator, practice) =====
let GT={sub:'ref',q:'',verb:'',open:{},copen:{pres:1,pret:1,impf:1,fut:1}};
let GQ=null,_GREF=null;
const GQUICK=['ser','estar','tener','ir','hacer','poder','querer','decir','venir','poner','saber','ver','dar','salir'];
function gcfg(){if(!S.gcfg)S.gcfg={t:['pres','pret','impf'],v:'all',n:10};if(!S.gs)S.gs={n:0,ok:0};if(!S.gw)S.gw={};return S.gcfg}
function gsub(x){GT.sub=x;render()}

function grammarView(){
  gcfg();
  const sg=[['ref','Reference'],['conj','Conjugator'],['prac','Practice']];
  return '<h1>Grammar</h1><div class="seg">'+sg.map(s=>'<button class="'+(GT.sub===s[0]?'on':'')+'" onclick="gsub(\''+s[0]+'\')">'+s[1]+'</button>').join('')+'</div>'+
    (GT.sub==='ref'?gRefHtml():GT.sub==='conj'?gConjHtml():gPracHtml());
}

// ---- reference ----
function gRefHtml(){
  if(!_GREF){_GREF=gTopics();_GREF.forEach(t=>t.s=gplain((t.title+' '+t.sub+' '+t.html.replace(/<[^>]+>/g,' ')).toLowerCase()))}
  return '<input id="gq" placeholder="Search topics, e.g. indirect, por, gustar" value="'+esc(GT.q)+'" oninput="gfilter(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'+
    '<div id="gtop" style="margin-top:12px">'+_GREF.map((t,i)=>'<details class="card gd" data-i="'+i+'"'+(GT.open[t.id]?' open':'')+' ontoggle="GT.open[\''+t.id+'\']=this.open"><summary><b>'+t.title+'</b><span class="mu">'+t.sub+'</span></summary><div class="gb">'+t.html+'</div></details>').join('')+'<div id="gnone" class="mu" style="display:none;text-align:center">Nothing found.</div></div>';
}
function gfilter(q){
  GT.q=q;const w=gplain(q.toLowerCase()).trim().split(/\s+/).filter(Boolean);let n=0;
  const ds=[...document.querySelectorAll('.gd')];
  ds.forEach(d=>{const t=_GREF[+d.dataset.i],ok=w.every(x=>t.s.includes(x));d.style.display=ok?'':'none';if(ok)n++});
  const nn=$('#gnone');if(nn)nn.style.display=n?'none':'';
}

// ---- conjugator ----
function gConjHtml(){
  return '<input id="gv" list="gvl" placeholder="Type a verb, e.g. hablar, tener, acostarse" value="'+esc(GT.verb)+'" oninput="gverb(this.value)" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">'+
    '<datalist id="gvl">'+GV.map(v=>'<option value="'+v.inf+'">'+esc(v.en)+'</option>').join('')+'</datalist>'+keysRow('gv')+
    '<div class="gchips">'+GQUICK.map(v=>'<button class="chip" onclick="gpick(\''+v+'\')">'+v+'</button>').join('')+'</div>'+
    '<div id="gres">'+gConjRes()+'</div>';
}
function gpick(v){GT.verb=v;const i=$('#gv');if(i)i.value=v;$('#gres').innerHTML=gConjRes();window.scrollTo(0,0)}
function gverb(v){GT.verb=v;$('#gres').innerHTML=gConjRes()}
function gToggleT(k,el){GT.copen[k]=el.open?1:0}
function gAll(open){GT_LIST.forEach(t=>GT.copen[t[0]]=open?1:0);$('#gres').innerHTML=gConjRes()}
function gConjRes(){
  const q=(GT.verb||'').trim();
  if(!q)return '<div class="mu" style="margin-top:12px">Type any Spanish infinitive. About '+GV.length+' common verbs with their irregular forms are built in, and other verbs are shown as regular.</div>';
  const r=gfind(q);
  if(!r)return '<div class="mu" style="margin-top:12px">Type an infinitive, for example <b>hablar</b>, <b>comer</b> or <b>vivir</b>.</div>';
  const v=r.v,c=gconj(v),rg=gconj({inf:v.inf,f:{}});
  let h='<div class="card" style="margin-top:12px"><div class="big" style="font-size:30px;margin:4px 0 2px">'+esc(v.inf)+'</div>'+
    (r.known?'<div class="mu" style="text-align:center">'+esc(v.en)+' · '+esc(v.de)+'</div>':'<div class="mu" style="text-align:center">Not in my list, so these are regular forms. Check irregulars yourself.</div>')+
    '<div class="row" style="justify-content:center;gap:18px;margin-top:10px"><span><span class="mu">Gerundio</span> <b'+(c.ger!==rg.ger?' class="irr"':'')+'>'+esc(c.ger)+'</b></span><span><span class="mu">Participio</span> <b'+(c.part!==rg.part?' class="irr"':'')+'>'+esc(c.part)+'</b></span></div>'+
    (v.irr?'<div class="mu" style="text-align:center;margin-top:8px">Irregular or spelling changes are shown in colour.</div>':'')+
    '<div class="row" style="margin-top:8px"><button class="btn sec" style="margin:0" onclick="gAll(true)">Open all</button><button class="btn sec" style="margin:0" onclick="gAll(false)">Close all</button></div></div>';
  let grp='';
  GT_LIST.forEach(t=>{
    if(t[2]!==grp){grp=t[2];h+='<div class="mu" style="margin:14px 2px 6px;text-transform:uppercase;letter-spacing:.6px;font-size:12px">'+grp+'</div>'}
    const f=c.T[t[0]],imp=t[0]==='impa'||t[0]==='impn';
    h+='<details class="card gd2"'+(GT.copen[t[0]]?' open':'')+' ontoggle="gToggleT(\''+t[0]+'\',this)"><summary><b>'+t[1]+'</b></summary>';
    if(!f)h+='<div class="mu" style="margin-top:8px">With reflexive verbs the pronoun is attached to the command (for example levántate). Use the negative form here.</div>';
    else h+='<table class="gt" style="margin-top:6px"><tbody>'+f.map((x,i)=>'<tr><td class="pc">'+(imp?GIMP[i]:GP[i])+'</td><td'+(x!==rg.T[t[0]][i]?' class="irr"':'')+'>'+esc(x)+'</td></tr>').join('')+'</tbody></table>';
    h+='</details>';
  });
  return h;
}

// ---- practice ----
function gNormA(s){return s.trim().toLowerCase().replace(/\s+/g,' ')}
function gAlts(c,k){
  const a=[c];
  if(k==='simp')a.push(gseSwap(c));
  if(k==='splus')a.push(c.split(' ').map(w=>/^hubi/.test(w)?gseSwap(w):w).join(' '));
  if(k==='impn')a.push(c.replace(/^no /,''));
  return a.map(gNormA);
}
function gPool(){
  const cfg=gcfg();
  return GV.filter(v=>cfg.v==='irr'?v.irr:cfg.v==='reg'?!v.irr:true);
}
function gStart(){
  const cfg=gcfg();if(!gPool().length||!cfg.t.length)return;
  GQ={n:cfg.n,i:0,ok:0,st:'ask',cur:null,miss:[],val:''};gNew();render();
}
function gNew(){
  const cfg=gcfg(),pool=gPool();let it=null;
  const weak=Object.keys(S.gw).filter(k=>{const a=k.split('|');return cfg.t.includes(a[1])&&pool.some(v=>v.inf===a[0])});
  if(weak.length&&Math.random()<.35){
    const k=weak[Math.floor(Math.random()*weak.length)].split('|'),v=GVM[k[0]],c=gconj(v);
    if(c.T[k[1]])it={v,k:k[1],p:+k[2],c};
  }
  for(let g=0;!it&&g<50;g++){
    const v=pool[Math.floor(Math.random()*pool.length)],k=cfg.t[Math.floor(Math.random()*cfg.t.length)],c=gconj(v);
    if(!c.T[k])continue;
    const p=Math.floor(Math.random()*c.T[k].length);
    if(GQ.cur&&GQ.cur.v===v&&GQ.cur.k===k&&GQ.cur.p===p)continue;
    it={v,k,p,c};
  }
  if(!it){const v=pool[0],c=gconj(v);it={v,k:'pres',p:0,c}}
  it.ans=it.c.T[it.k][it.p];GQ.cur=it;GQ.st='ask';GQ.val='';
}
function gcheck(){
  if(!GQ||GQ.st!=='ask')return;
  const el=$('#gin'),val=el?el.value:'';if(!val.trim())return;
  const it=GQ.cur,alts=gAlts(it.ans,it.k),a=gNormA(val);
  const key=it.v.inf+'|'+it.k+'|'+it.p;
  GQ.val=val;
  if(alts.includes(a)){
    GQ.st='ok';GQ.ok++;S.gs.n++;S.gs.ok++;
    if(S.gw[key])delete S.gw[key];
    try{sfx(true)}catch(e){}
  }else{
    GQ.st='bad';GQ.accent=alts.some(x=>gplain(x)===gplain(a));S.gs.n++;
    S.gw[key]=(S.gw[key]||0)+1;
    const ks=Object.keys(S.gw);if(ks.length>300)delete S.gw[ks[0]];
    GQ.miss.push({inf:it.v.inf,k:it.k,p:it.p,ans:it.ans,val:val});
    try{sfx(false)}catch(e){}
  }
  save();render();
}
function gnext(){
  if(!GQ)return;
  GQ.i++;
  if(GQ.i>=GQ.n){GQ.cur=null;GQ.st='end';render();return}
  gNew();render();
}
function gStop(){GQ=null;render()}
function gtog(k){const c=gcfg(),i=c.t.indexOf(k);if(i>=0){if(c.t.length>1)c.t.splice(i,1)}else c.t.push(k);save();render()}
function gset(f,v){gcfg()[f]=f==='n'?+v:v;save();render()}
function gResetStats(){S.gs={n:0,ok:0};S.gw={};save();render()}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||tab!=='grammar'||GT.sub!=='prac'||!GQ||!GQ.cur)return;
  e.preventDefault();
  if(GQ.st==='ask')gcheck();else gnext();
});

function gPracHtml(){
  const cfg=gcfg();
  if(GQ&&GQ.st==='end'){
    let h='<div class="card"><div class="big" style="margin-top:6px">'+GQ.ok+' / '+GQ.n+'</div><div class="mu" style="text-align:center">'+(GQ.ok===GQ.n?'Perfect round.':GQ.ok>=GQ.n*0.8?'Very good.':'Keep going, the misses come back more often.')+'</div>';
    if(GQ.miss.length){h+='<div class="mu" style="margin:14px 0 4px">To review</div>'+GQ.miss.map(m=>'<div class="w"><div><b>'+esc(m.ans)+'</b><div class="mu">'+esc(m.inf)+' · '+(m.k.startsWith('imp')?GIMP[m.p]:GP[m.p])+' · '+GT_NAME[m.k]+'</div></div><div class="mu" style="text-align:right">you: '+esc(m.val)+'</div></div>').join('')}
    h+='<button class="btn" onclick="gStart()">Practise again</button><button class="btn sec" onclick="gStop()">Back to settings</button></div>';
    return h;
  }
  if(GQ&&GQ.cur){
    const it=GQ.cur,imp=it.k==='impa'||it.k==='impn',pers=imp?GIMP[it.p]:GP[it.p],done=GQ.st!=='ask';
    let h='<div class="card"><div class="prog"><i style="width:'+Math.round(GQ.i/GQ.n*100)+'%"></i></div><div class="mu" style="display:flex;justify-content:space-between"><span>Question '+(GQ.i+1)+' of '+GQ.n+'</span><span>'+GQ.ok+' right</span></div>'+
      '<div class="big" style="margin:14px 0 4px">'+esc(it.v.inf)+'</div><div class="mu" style="text-align:center">'+esc(it.v.en)+'</div>'+
      '<div style="text-align:center;margin:12px 0 4px;font-size:18px"><b>'+pers+'</b> <span class="mu">·</span> <span style="color:var(--ac)">'+GT_NAME[it.k]+'</span></div>'+
      '<input id="gin" '+(done?'readonly ':'')+'value="'+esc(GQ.val||'')+'" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" style="text-align:center;font-size:20px;margin-top:6px">'+
      (done?'':keysRow('gin'));
    if(GQ.st==='ok')h+='<div class="fb ok">Correct: '+esc(it.ans)+'</div>';
    if(GQ.st==='bad')h+='<div class="fb bad">'+(GQ.accent?'Almost, mind the accents. ':'')+'Correct: '+esc(it.ans)+'</div>';
    h+=done?'<button class="btn" onclick="gnext()">'+(GQ.i+1>=GQ.n?'Finish':'Next')+'</button>':'<button class="btn" onclick="gcheck()">Check</button>';
    h+='<button class="btn sec" onclick="gStop()">Stop</button></div>';
    return h;
  }
  const pool=gPool(),weak=Object.keys(S.gw).length;
  const acc=S.gs.n?Math.round(S.gs.ok/S.gs.n*100):0;
  let h='<div class="card"><div class="mu" style="margin-bottom:8px">Tenses to practise</div><div>'+
    ['Indicativo','Subjuntivo','Imperativo'].map(g=>'<div class="mu" style="margin:8px 0 2px;font-size:12px">'+g+'</div>'+GT_LIST.filter(t=>t[2]===g).map(t=>'<button class="chip'+(cfg.t.includes(t[0])?' on':'')+'" onclick="gtog(\''+t[0]+'\')">'+t[1]+'</button>').join('')).join('')+'</div>'+
    '<div class="mu" style="margin:14px 0 6px">Verbs</div><select onchange="gset(\'v\',this.value)"><option value="all"'+(cfg.v==='all'?' selected':'')+'>All verbs ('+GV.length+')</option><option value="irr"'+(cfg.v==='irr'?' selected':'')+'>Irregular or spelling changes only ('+GV.filter(v=>v.irr).length+')</option><option value="reg"'+(cfg.v==='reg'?' selected':'')+'>Regular verbs only ('+GV.filter(v=>!v.irr).length+')</option></select>'+
    '<div class="mu" style="margin:14px 0 6px">Questions per round</div><select onchange="gset(\'n\',this.value)">'+[10,20,30,50].map(n=>'<option value="'+n+'"'+(cfg.n===n?' selected':'')+'>'+n+'</option>').join('')+'</select>'+
    '<button class="btn" onclick="gStart()">Start</button></div>'+
    '<div class="card"><div class="mu">All time: '+S.gs.n+' answers, '+acc+'% right'+(weak?'. '+weak+' forms to review, they come back more often.':'.')+'</div>'+(S.gs.n?'<button class="btn sec" style="margin-top:10px" onclick="gResetStats()">Reset practice stats</button>':'')+
    '<div class="mu" style="margin-top:10px">Type the full form, with accents. Reflexive verbs need the pronoun (me levanto). Negative commands can be typed with or without no. For the imperfect subjunctive, both -ra and -se forms are accepted.</div></div>';
  return h;
}

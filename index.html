*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.mu{color:var(--mu);font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:16px}
textarea{min-height:90px}
.btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:var(--ac);color:var(--on-ac);font-weight:600;font-size:17px;margin-top:10px}
.btn.sec{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.btn:disabled{opacity:.4}
.row{display:flex;gap:8px;align-items:center}
.big{font-size:34px;font-weight:700;text-align:center;margin:16px 0 8px;word-break:break-word}
.lab{text-align:center}
.keys{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center}
.keys button{min-width:38px;padding:9px 0;border-radius:8px;border:1px solid var(--bd);background:var(--card);font-size:18px}
.fb{padding:12px;border-radius:10px;margin-top:12px;font-weight:600}
.fb.ok{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.fb.bad{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}
.bar i{display:block;height:10px;border-radius:5px;background:var(--ac);min-width:3px}
.bar span:first-child{width:62px;color:var(--mu)}
.w{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--bd)}
.w:last-child{border:0}
.w button{border:0;background:none;color:var(--bad);font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px;border:0;background:none;font-weight:600;color:var(--mu)}
nav button.on{color:var(--ac)}
.prog{height:6px;background:var(--bd);border-radius:3px;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--ac);border-radius:3px}
.dia{font-style:italic;font-weight:500;color:var(--dia);font-size:.6em;white-space:nowrap}
.w .dia,.fb .dia{font-size:.85em}
.w button.e{color:var(--ac)}

<body>
<div id="app"></div>
<nav><button id="t-learn" onclick="go('learn')">Learn</button><button id="t-words" onclick="go('words')">Words</button><button id="t-course" onclick="go('course')">Course</button></nav>
<script>
// Review gaps for each phase. A wrong answer sends the card back to phase 1 (10 minutes).
const MIN=60000, DAY=864e5, INT=[0,10*MIN,DAY,3*DAY,7*DAY,14*DAY,30*DAY];
const KEY='vocab-trainer-v1';
let S={cards:[],dir:'both',seeded:false};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.cards)S=r}catch(e){}
const THEMES={forest:{n:'Forest',bar:'#222b26'},beach:{n:'Beach',bar:'#f3ead7'},mountain:{n:'Snowy mountains',bar:'#e6eef5'},autumn:{n:'Autumn town',bar:'#2a2420'},city:{n:'City at night',bar:'#1f2530'}};
function applyTheme(){const t=THEMES[S.theme]?S.theme:'forest';document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=THEMES[t].bar}
function setTheme(v){S.theme=v;save();render()}
// Sync between devices through a private GitHub Gist. The token stays in this browser only and is never part of the backup.
const TK='vocab-trainer-token',SK='vocab-trainer-sync',GF='vocab-trainer.json';
let SYN={tok:'',gid:'',base:0},SY={st:'',msg:'',conf:null,busy:false,last:0},booting=false,pushT=null;
try{SYN.tok=localStorage.getItem(TK)||'';const o=JSON.parse(localStorage.getItem(SK)||'{}');SYN.gid=o.gid||'';SYN.base=o.base||0}catch(e){}
function synSave(){try{localStorage.setItem(TK,SYN.tok);localStorage.setItem(SK,JSON.stringify({gid:SYN.gid,base:SYN.base}))}catch(e){}}
const seed=[];
migrate();
if(!S.cards.length&&!S.seeded){seed.forEach(w=>addCard(w[0],w[1]));S.seeded=true;save()}
function save(){
  S.mod=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(SYN.tok&&SYN.gid&&!SY.conf&&!booting){clearTimeout(pushT);pushT=setTimeout(()=>syncNow(false),15000)}
}
function addCard(es,de,wait){
  const c={id:Date.now()+Math.floor(Math.random()*1e6),l:S.view,es:es,de:de,sd:{p:1,due:0},ds:{p:1,due:0}};
  if(wait)c.w=true;
  S.cards.push(c);
}
// Makes sure every card belongs to a list and the selected lists exist (also upgrades older saved data).
function migrate(){
  if(!S.lists||!S.lists.length)S.lists=[{id:1,name:'My words'}];
  S.cards.forEach(c=>{if(!S.lists.some(l=>l.id===c.l))c.l=S.lists[0].id});
  S.lists.forEach(l=>{if(l.lang!=='en')l.lang='de'});
  if(!S.perDay)S.perDay=5;
  if(!S.packs)S.packs={};
  if(!S.lists.some(l=>l.id===S.view))S.view=S.lists[0].id;
  if(S.sel!=='all'&&!S.lists.some(l=>l.id===S.sel))S.sel='all';
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>s.toLowerCase().replace(/[¿¡?!.,:…]/g,' ').replace(/\s+/g,' ').trim();
const plain=s=>norm(s).replace(/ß/g,'ss').replace(/ñ/g,'\u0001').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
// 2 = exact, 1 = only accents differ (still counted correct), 0 = wrong
// A dialect tag looks like {LatAm}. It is shown in italics but never counted when checking what you typed.
const clean=s=>{const b=s.replace(/\s*\{[^}]*\}/g,'').replace(/\(?\b(?:etw|jdn|jdm)\b\.?(?:\/(?:etw|jdn|jdm)\b\.?)?\)?\s*/g,' ').replace(/\s+/g,' ').trim();const r=b.replace(/\s+(?:hacer\s+)?(?:(?:de|en|a|por)\s+)?(?:algo|alguien)\b/g,'').replace(/\s+(?:a\s+)?alguien\b/g,'').trim();return r||b};
const show=s=>esc(s).replace(/\{([^}]*)\}/g,'<i class="dia">$1</i>');
// A card can list several answers separated by " / ". A dialect word ({LatAm}, {Arg}) counts as a variant of the word before it.
function groups(answer){
  const g=[];
  answer.split(/\s*\/\s*/).forEach(a=>{
    const dia=/\{(?:LatAm|Arg)\}/.test(a),c=clean(a);
    if(!c)return;
    if(dia&&g.length)g[g.length-1].push(c);else g.push([c]);
  });
  return g;
}
function parts(input){const i=clean(input);return [i].concat(i.split(/\s*[\/;,]\s*/).filter(Boolean))}
function strictOn(gs){return !S.any&&gs.length>1}
function covers(fn,gs,ps,strict){
  if(!strict){const alts=gs.flat();if(alts.some(a=>fn(a)===fn(ps[0])))return true;const r=ps.slice(1);return r.length>1&&r.every(p=>alts.some(a=>fn(a)===fn(p)))}
  return gs.every(g=>g.some(a=>ps.some(p=>fn(a)===fn(p))));
}
function grade(input,answer){
  const gs=groups(answer),ps=parts(input),st=strictOn(gs);
  return covers(norm,gs,ps,st)?2:covers(plain,gs,ps,st)?1:0;
}
// Every answer on a card is typed, but at least one has a small typo
function nearAll(input,answer){
  const gs=groups(answer);if(!strictOn(gs))return false;
  const ps=parts(input).slice(1);
  const close=(a,p)=>{const x=plain(a),y=plain(p),lim=x.length>=8?2:x.length>=4?1:0;return x===y||(lim>0&&dist(x,y)<=lim)};
  return gs.every(g=>g.some(a=>ps.some(p=>close(a,p))));
}
// Typed some but not all of the answers on a card that needs all of them
function partial(input,answer){
  const gs=groups(answer);if(!strictOn(gs))return false;
  const ps=parts(input);
  return gs.some(g=>g.some(a=>ps.some(p=>plain(a)===plain(p))))&&!covers(plain,gs,ps,true);
}
function items(){
  const out=[];
  S.cards.filter(c=>!c.w&&(S.sel==='all'||c.l===S.sel)).forEach(c=>['sd','ds'].forEach(d=>{if(S.dir==='both'||S.dir===d)out.push({c:c,d:d})}));
  return out;
}
// New words wait in a queue (c.w). Each day up to S.perDay of them are released, taking turns between lists.
function today(){const d=new Date();return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
function releaseNew(n){
  const qs=S.lists.map(l=>S.cards.filter(c=>c.w&&c.l===l.id&&(S.sel==='all'||S.sel===l.id))).filter(q=>q.length);
  let k=0;
  while(k<n&&qs.some(q=>q.length)){
    for(const q of qs){if(k>=n)break;const c=q.shift();if(c){delete c.w;c.sd.due=0;c.ds.due=0;k++}}
  }
  return k;
}
function daily(){
  let ch=false;
  if(S.day!==today()){S.day=today();S.rel=0;ch=true}
  const n=S.perDay-(S.rel||0);
  if(n>0){const k=releaseNew(n);if(k){S.rel=(S.rel||0)+k;ch=true}}
  if(ch)save();
}
let moreN=10;
function moreGo(){const v=Math.floor(+$('#mn').value);if(!(v>0))return;moreN=v;more(v)}
function more(n){S.rel=(S.rel||0)+releaseNew(n);save();render()}
function rel(ms){const m=Math.max(1,Math.round(ms/MIN));if(m<60)return m+' min';const h=Math.round(m/60);if(h<48)return h+' h';return Math.round(h/24)+' days'}

let tab='learn', Q=null;
function go(t){tab=t;Q=null;delArm=false;ed=null;render()}
function render(){
  applyTheme();
  $('#t-learn').className=tab==='learn'?'on':'';
  $('#t-words').className=tab==='words'?'on':'';
  $('#t-course').className=tab==='course'?'on':'';
  $('#app').innerHTML=tab==='words'?wordsView():tab==='course'?courseView():(Q?quizView():homeView());
  const f=$('#ans')||$('#re');if(f){f.focus();f.setSelectionRange(f.value.length,f.value.length)}
}

// What goes to the cloud: everything except the pasted course text.
function snap(){const o=Object.assign({},S);delete o.courseText;return JSON.stringify(o)}
function gh(path,opt){
  opt=opt||{};
  const h={'Authorization':'Bearer '+SYN.tok,'Accept':'application/vnd.github+json'};
  if(opt.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined}).then(r=>{

async function fetchRemote(){
  const g=await gh('/gists/'+SYN.gid),f=g.files&&g.files[GF];
  if(!f)throw Object.assign(new Error('missing'),{status:404});
  let t=f.content;
  if(f.truncated||t==null)t=await (await fetch(f.raw_url)).text();
  const r=JSON.parse(t);
  if(!r||!r.cards)throw new Error('bad data');
  return r;
}

function applyRemote(r){

function synErr(e){
  if(e.status===401)return 'GitHub did not accept the token. Check it and connect again.';
  if(e.status===403)return 'GitHub refused the request. The token needs the gist permission, or try again in a few minutes.';
  if(e.status===404)return 'The sync notebook was not found. Disconnect and connect again.';
  if(e.name==='TypeError')return 'No connection. It will sync again when you are online.';
  return 'Something went wrong while syncing.';
}

}
function synStatus(){
  if(SY.busy)return 'Syncing...';
  if(SY.st==='err')return esc(SY.msg);
  if(SY.last){const m=Math.round((Date.now()-SY.last)/MIN);return 'Synced '+(m<1?'just now':m+' min ago')}
  return 'Connected. Not synced yet.';
}
async function syncNow(manual){
  if(!SYN.tok||!SYN.gid||SY.busy||SY.conf)return;
  SY.busy=true;SY.st='';synUi();
  try{
    const r=await fetchRemote(),rm=r.mod||0,lm=S.mod||0,b=SYN.base,lc=lm>b,rc=rm>b;
    if(lc&&rc&&rm!==lm){SY.conf={r};render()}
    else if(rc&&!lc){if(manual||(!Q&&ed===null))applyRemote(r)}
    else if(lc)await pushNow();
    SY.last=Date.now();
  }catch(e){SY.st='err';SY.msg=synErr(e)}
  SY.busy=false;synUi();
}
async function connectSync(){
  const t=$('#tok').value.trim();
  if(!t)return;
  SYN.tok=t;SYN.gid='';SY.busy=true;SY.st='';SY.msg='';synUi();
  try{
    let found=null;
    for(let pg=1;pg<=5&&!found;pg++){
      const l=await gh('/gists?per_page=100&page='+pg);
      if(!l.length)break;
      found=l.find(g=>g.files&&g.files[GF]);
    }
    if(found){
      SYN.gid=found.id;
      const r=await fetchRemote();
      if((S.cards.length)&&(r.mod||0)>0){SYN.base=0;synSave();SY.conf={r}}
      else applyRemote(r);
    }else{
      if(!S.mod)S.mod=Date.now();
      const g=await gh('/gists',{method:'POST',body:{description:'Spanish trainer sync',public:false,files:{[GF]:{content:snap()}}}});
      SYN.gid=g.id;SYN.base=S.mod;synSave();
    }
    synSave();SY.last=Date.now();
  }catch(e){SYN.tok='';SYN.gid='';SY.st='err';SY.msg=synErr(e);synSave()}
  SY.busy=false;render();
}
async function resolveSync(useCloud){
  const r=SY.conf&&SY.conf.r;SY.conf=null;
  if(useCloud&&r){applyRemote(r);SY.last=Date.now();return}
  SY.busy=true;synUi();
  try{S.mod=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}await pushNow();SY.last=Date.now()}
  catch(e){SY.st='err';SY.msg=synErr(e)}
  SY.busy=false;render();
}

function answerOf(it){return it.d==='sd'?it.c.de:it.c.es}
// Edit distance: how many single letter changes turn a into b.
function dist(a,b){
  const m=a.length,n=b.length;let p=[];for(let j=0;j<=n;j++)p[j]=j;
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[n];
}
// A near miss is a likely typo: 1 letter off for words of 4+ letters, 2 letters off for 8+ letters.
function near(v,answer){
  return clean(answer).split(/\s*[\/;]\s*/).some(a=>{
    const x=plain(a),y=plain(v),lim=x.length>=8?2:x.length>=4?1:0;
    return lim>0&&dist(x,y)<=lim;
  });
}
function check(){
  const it=Q.queue[0],v=$('#ans').value;
  if(!v.trim())return;
  Q.val=v;Q.g=grade(v,answerOf(it));
  if(!Q.g&&!Q.tried&&nearAll(v,answerOf(it))){Q.tried=true;Q.hint='spell';render();return}
  if(!Q.g&&!Q.tried&&partial(v,answerOf(it))){Q.tried=true;Q.hint='more';render();return}
  if(!Q.g&&!Q.tried&&near(v,answerOf(it))){Q.tried=true;Q.hint='spell';render();return}
  Q.hint=false;
  if(!it.retry){
    const s=it.c[it.d];
    Q.prev={p:s.p,due:s.due};
    if(Q.g){
      promote(s);
      Q.right++;
    }else{s.p=1;s.due=Date.now()+INT[1]}
    save();
  }
  Q.st=Q.g?'ok':'bad';render();
}

function newList(){
  const n=$('#nl').value.trim();if(!n)return;
  const id=Date.now();S.lists.push({id:id,name:n,lang:$('#nlang').value});S.view=id;delArm=false;save();render();
}
function delList(){
  if(!delArm){delArm=true;render();return}
  delArm=false;
  S.cards=S.cards.filter(c=>c.l!==S.view);
  if(S.lists.length>1)S.lists=S.lists.filter(x=>x.id!==S.view);
  migrate();save();render();
}

// The course words are not part of this page. They are pasted in once on the Course tab and stored in this browser only.
// Format: "# Unit name", then "## Section name", then lines like "Spanish ; German".
let COURSE=[];
function parseCourse(t){
  const us=[];let u=null,sec=null;
  String(t||'').split('\n').forEach(raw=>{
    const line=raw.trim();if(!line)return;
    if(line.startsWith('## ')){if(!u){u={u:'Course',s:[]};us.push(u)}sec=[line.slice(3).trim(),[]];u.s.push(sec);return}
    if(line.startsWith('# ')){u={u:line.slice(2).trim(),s:[]};us.push(u);sec=null;return}
    const q=line.split(/\s*;\s*/);
    if(q.length<2||!q[0]||!q[1])return;
    if(!u){u={u:'Course',s:[]};us.push(u)}
    if(!sec){sec=['Words',[]];u.s.push(sec)}
    sec[1].push(q[0]+' ; '+q[1]);
  });
  return us.map(x=>({u:x.u,s:x.s.filter(y=>y[1].length).map(y=>[y[0],y[1].join('\n')])})).filter(x=>x.s.length);
}
function loadCourse(){COURSE=parseCourse(S.courseText)}
function saveCourse(){
  const t=$('#ctext').value;
  if(!parseCourse(t).length){$('#cmsg').textContent='No words found. Each line needs the form: Spanish ; German';return}
  S.courseText=t;loadCourse();save();render();
}
function serializeCourse(us){return us.map(u=>'# '+u.u+'\n'+u.s.map(x=>'## '+x[0]+'\n'+x[1]).join('\n')).join('\n')+'\n'}
function addCourse(){
  const t=$('#ctext').value,nu=parseCourse(t);
  if(!nu.length){$('#cmsg').textContent='No words found. Each line needs the form: Spanish ; German';return}
  const have=new Set(COURSE.map(u=>u.u)),add=nu.filter(u=>!have.has(u.u)),skip=nu.length-add.length;
  if(!add.length){$('#cmsg').textContent='Nothing added. All '+nu.length+' units are already in your course.';return}
  S.courseText=(S.courseText?S.courseText.replace(/\s*$/,'\n'):'')+serializeCourse(add);
  loadCourse();save();render();
  $('#cmsg').textContent=add.length+' units added'+(skip?', '+skip+' skipped because they already exist':'')+'.';
}
function removeCourse(){S.courseText='';loadCourse();save();render()}
// Cut a unit into packs of 20 words and remember which sections each pack covers.
function packs(u){
  const w=[];u.s.forEach(x=>x[1].trim().split('\n').forEach(l=>w.push([x[0],l.trim()])));
  // Packs hold about 20 words each. The words are spread evenly, so there is never a tiny leftover pack.
  const k=Math.max(1,Math.round(w.length/20)),out=[];let a=0;
  for(let i=0;i<k;i++){const b=Math.round((i+1)*w.length/k),c=w.slice(a,b);a=b;out.push({lines:c.map(x=>x[1]),secs:[...new Set(c.map(x=>x[0]))]})}
  return out;
}
function packDone(pid){return S.packs[pid]&&S.lists.some(l=>l.id===S.packs[pid])}
// Adding a pack creates a list. Its words wait in the queue. Words you already have are skipped.
function addPack(ui,pi){
  const u=COURSE[ui],p=packs(u)[pi],pid=u.u+' Pack '+(pi+1);
  if(packDone(pid))return;
  const have=new Set(S.cards.map(c=>clean(c.es).toLowerCase()));
  const id=Date.now()+ui*50+pi,old=S.view;
  S.lists.push({id:id,name:pid,lang:'de'});S.view=id;
  p.lines.forEach(l=>{const q=l.split(/\s*;\s*/);if(q.length>=2&&!have.has(clean(q[0]).toLowerCase()))addCard(q[0].trim(),q[1].trim(),true)});
  S.view=old;S.packs[pid]=id;save();render();
}
function nextPack(){
  for(let ui=0;ui<COURSE.length;ui++){const ps=packs(COURSE[ui]);for(let pi=0;pi<ps.length;pi++){if(!packDone(COURSE[ui].u+' Pack '+(pi+1))){addPack(ui,pi);return}}}
}
let cpv=null;
function courseView(){
  const box='<textarea id="ctext" style="min-height:150px" placeholder="Paste the course text here" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>';
  if(!COURSE.length)return '<h1>Course</h1><div class="card"><div class="mu" style="margin-bottom:10px">The course words are not part of this page. Paste your course text here once. It stays in this browser on this device.</div>'+box+'<button class="btn" onclick="saveCourse()">Save course text</button><div id="cmsg" class="mu" style="margin-top:8px"></div></div>';
  let n=0,pk=0;COURSE.forEach(u=>{const ps=packs(u);pk+=ps.length;ps.forEach(p=>n+=p.lines.length)});
  let h='<h1>Course</h1><div class="mu" style="margin-bottom:12px">'+n+' words in '+pk+' packs of about 20 words. Tap Add and the pack becomes a list. Its words wait in the queue and arrive at your daily pace.</div><button class="btn" style="margin:0 0 14px" onclick="nextPack()">Add the next pack</button>';
  COURSE.forEach((u,ui)=>{
    h+='<div class="card"><b>'+esc(u.u)+'</b>';
    packs(u).forEach((p,pi)=>{
      const done=packDone(u.u+' Pack '+(pi+1)),id=ui+'-'+pi,open=cpv===id;
      h+='<div class="w"><div>Pack '+(pi+1)+'<div class="mu">'+esc(p.secs.join(', '))+' · '+p.lines.length+' words</div></div><div style="white-space:nowrap"><button class="e" style="font-size:16px" onclick="cpv=\''+(open?'':id)+'\';render()">'+(open?'Hide':'Preview')+'</button> '+(done?'<span class="mu">Added</span>':'<button class="e" style="font-size:16px" onclick="addPack('+ui+','+pi+')">Add</button>')+'</div></div>';
      if(open)h+='<div style="padding:2px 0 10px">'+p.lines.map(l=>{const q=l.split(/\s*;\s*/);return '<div class="w" style="padding:6px 0"><b>'+show(q[0])+'</b><span class="mu" style="text-align:right">'+show(q[1])+'</span></div>'}).join('')+'</div>';
    });
    h+='</div>';
  });
  h+='<div class="card"><div class="mu" style="margin-bottom:8px">Add more course text, or replace it. Lists you already added stay as they are.</div>'+box+'<button class="btn" onclick="addCourse()">Add to course text</button><button class="btn sec" onclick="saveCourse()">Replace course text</button><button class="btn sec" style="color:var(--bad);border-color:var(--bad)" onclick="removeCourse()">Remove course text</button><div id="cmsg" class="mu" style="margin-top:8px"></div></div>';
  return h;
}
function exp(){
  const t=$('#bk');t.value=JSON.stringify(S);t.select();
  try{navigator.clipboard.writeText(t.value);$('#bkmsg').textContent='Copied. Paste it into Notes to keep it safe.'}catch(e){$('#bkmsg').textContent='Select all and copy this text.'}
}
function imp(){
  try{
    const r=JSON.parse($('#bk').value);
    if(!r||!Array.isArray(r.cards))throw 0;
    const keep=S.courseText;S=r;if(!S.courseText&&keep)S.courseText=keep;S.seeded=true;migrate();loadCourse();save();render();
  }catch(e){$('#bkmsg').textContent='That text is not a valid backup.'}
}
document.addEventListener('visibilitychange',()=>{
  if(!SYN.tok||!SYN.gid)return;
  if(document.visibilityState==='visible'){if(!Q)syncNow(false)}
  else if((S.mod||0)>SYN.base)syncNow(false);
});
loadCourse();
if(SYN.tok&&SYN.gid){
  booting=true;render();
  Promise.race([syncNow(false),new Promise(r=>setTimeout(r,6000))]).then(()=>{booting=false;render()});
}else render();
</script>

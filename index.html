*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
#app{max-width:520px;margin:0 auto;padding:16px 16px 90px}
h1{font-size:22px;margin:4px 0 14px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px}
.mu{color:var(--mu);font-size:14px}
button,select,input,textarea{font:inherit;color:inherit}
input,textarea,select{width:100%;padding:12px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);font-size:16px}
textarea{min-height:90px}

.big{font-size:34px;font-weight:700;text-align:center;margin:16px 0 8px;word-break:break-word}
.lab{text-align:center}
.keys{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap;justify-content:center}

.fb{padding:12px;border-radius:10px;margin-top:12px;font-weight:600}

.bar{display:flex;align-items:center;gap:10px;margin:7px 0;font-size:14px}

.w button{border:0;background:none;color:var(--bad);font-size:20px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--nav);border-top:1px solid var(--bd);padding-bottom:env(safe-area-inset-bottom,0px)}

<body>
<div id="app"></div>
<nav><button id="t-learn" onclick="go('learn')">Learn</button><button id="t-words" onclick="go('words')">Words</button><button id="t-course" onclick="go('course')">Course</button><button id="t-grammar" onclick="go('grammar')">Grammar</button><button id="t-settings" onclick="go('settings')">Settings</button></nav>
<script>
// Review gaps for each phase. A wrong answer sends the card back to phase 1 (10 minutes).
const MIN=60000, DAY=864e5, INT=[0,10*MIN,DAY,3*DAY,7*DAY,14*DAY,30*DAY];
// Phases from 2 on count in calendar days. A new day starts at 4 am, so words you learned last night are ready this morning.
const ROLL=4,DAYS=[0,0,1,3,7,14,30];
function dueIn(n){const d=new Date(Date.now()-ROLL*36e5);return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n,ROLL).getTime()}
// Daily streak: answer at least the daily goal in a day (new day at 4 am). Retries and "No, I was right" do not count twice.
const GOALS=[5,10,20,30,50];
function dayNum(off){const d=new Date(Date.now()-ROLL*36e5);return Math.round(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate())/DAY)+(off||0)}
function skv(){const k=S.sk||(S.sk={d:0,n:0,cur:0,best:0,last:-9});const t=dayNum();if(k.d!==t){k.d=t;k.n=0}return k}
function streakNow(){const k=skv();return (k.last===dayNum()||k.last===dayNum(-1))?k.cur:0}
function countAnswer(){const k=skv(),g=S.goal||10;k.n++;if(k.n>=g&&k.last!==dayNum()){k.cur=(k.last===dayNum(-1))?k.cur+1:1;k.last=dayNum();if(k.cur>k.best)k.best=k.cur;return true}return false}
function streakCard(){
  const k=skv(),g=S.goal||10,s=streakNow(),done=k.n>=g;
  return '<div class="card"><div class="row" style="justify-content:space-between;align-items:flex-start"><div><div class="mu">Daily streak</div><div class="row" style="gap:8px;margin-top:2px"><svg width="26" height="26" viewBox="0 0 24 24"><path d="M12 2c1 4 6 6 6 12a6 6 0 0 1-12 0c0-3 2-4 3-7 1 1 2 2 2 3 1-2 1-5 1-8z" fill="var(--ac)"/></svg><span style="font-size:26px;font-weight:700">'+s+(s===1?' day':' days')+'</span></div></div><div class="mu" style="text-align:right">'+(done?'Goal reached today':Math.min(k.n,g)+' of '+g+' answers today')+'<br>Best: '+Math.max(k.best,s)+'</div></div><div class="prog" style="margin-top:12px;margin-bottom:0"><i style="width:'+Math.min(100,k.n/g*100)+'%"></i></div></div>';
}
function snapDay(t){const d=new Date(t-ROLL*36e5);return new Date(d.getFullYear(),d.getMonth(),d.getDate(),ROLL).getTime()}
const KEY='vocab-trainer-v1';
let S={cards:[],dir:'both',seeded:false};
try{const r=JSON.parse(localStorage.getItem(KEY));if(r&&r.cards)S=r}catch(e){}
const THEMES={forest:{n:'Forest',bar:'#222b26'},beach:{n:'Beach',bar:'#f3ead7'},mountain:{n:'Snowy mountains',bar:'#e6eef5'},autumn:{n:'Autumn town',bar:'#2a2420'},city:{n:'City at night',bar:'#1f2530'},christmas:{n:'Christmas',bar:'#2a1c1c'},spooky:{n:'Spooky night',bar:'#1b1526'}};
function applyTheme(){const t=THEMES[S.theme]?S.theme:'forest';document.documentElement.setAttribute('data-theme',t);const m=document.querySelector('meta[name=theme-color]');if(m)m.content=THEMES[t].bar}
function setTheme(v){S.theme=v;save();render()}
// Read aloud with the voices built into the phone. Which accents exist depends on the voices installed on the device.
const ICO='<svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 010 7M18.5 5.5a9 9 0 010 13"/></svg>';
const ACC={'es-ES':{n:'Spain',fb:['es-ES']},'es-AR':{n:'Argentina',fb:['es-AR','es-UY','es-MX','es-US','es-419']},'es-CO':{n:'Colombia',fb:['es-CO','es-VE','es-MX','es-US','es-419']}};
// The language being learned. Spanish is the default. Italian can be chosen in Settings or with the link ending in ?lang=it.
const TLS={
  es:{n:'Spanish',a:'Español',keys:'á é í ó ú ü ñ ¿ ¡',pre:'es',acc:ACC,def:'es-ES',test:'Hola, ¿cómo estás? Me gusta el mate.'},
  it:{n:'Italian',a:'Italiano',keys:'à è é ì ò ù',pre:'it',acc:{'it-IT':{n:'Italy',fb:['it-IT']},'it-CH':{n:'Switzerland',fb:['it-CH','it-IT']}},def:'it-IT',test:'Ciao, come stai? Mi piace il mate.'}
};
const TL=()=>TLS[S.tl]||TLS.es;
const accOf=()=>TL().acc[S.accent]?S.accent:TL().def;
let VOICES=[];
function loadVoices(){try{VOICES=('speechSynthesis' in window)?speechSynthesis.getVoices():[]}catch(e){VOICES=[]}}
loadVoices();
try{speechSynthesis.addEventListener('voiceschanged',()=>{loadVoices();const el=document.getElementById('vst');if(el)el.textContent=voiceStatus()})}catch(e){}
const vl=v=>(v.lang||'').replace('_','-').toLowerCase();
function pickVoice(acc){
  const vs=VOICES.filter(v=>vl(v).startsWith(TL().pre));
  const a=TL().acc[acc]||TL().acc[TL().def];
  for(const l of a.fb.concat([TL().def])){
    const m=vs.filter(v=>vl(v)===l.toLowerCase());
    if(m.length)return {v:m.find(v=>/enhanced|premium|siri/i.test(v.name+' '+(v.voiceURI||'')))||m[0],exact:l===a.fb[0]};
  }
  return vs.length?{v:vs[0],exact:false}:null;
}
function voiceStatus(){
  if(!('speechSynthesis' in window))return 'This browser cannot read aloud.';
  const acc=accOf(),p=pickVoice(acc);
  if(!p)return 'No '+TL().n+' voice found on this device yet, so nothing can be read aloud. On Windows open Settings, Time & language, Speech, Add voices and pick '+TL().n+'. On a Mac open System Settings, Accessibility, Spoken Content, System voice, Manage Voices. On an iPhone open Settings, Accessibility, Spoken Content, Voices. Then close the browser completely and open it again.';
  if(p.exact)return 'Voice: '+p.v.name+' ('+p.v.lang+')';
  return 'No '+TL().acc[acc].n+' voice is installed, so it uses '+p.v.name+' ('+p.v.lang+'). On an iPhone you can add one under Settings, Accessibility, Read & Speak (Spoken Content on older iOS), Voices, '+TL().n+'.';
}
// Which spelling to read: Spain skips Latin American variants, Argentina prefers {Arg}, Colombia prefers {LatAm}.
function pickAlt(es,acc){
  const alts=es.split(/\s*\/\s*/),tag=a=>/\{(?:LatAm|Arg)\}/.test(a);
  if(acc==='es-ES'||!/^es/.test(acc))return alts.find(a=>!tag(a))||alts[0];
  const want=acc==='es-AR'?['{Arg}','{LatAm}']:['{LatAm}'];
  for(const w of want){const f=alts.find(a=>a.includes(w));if(f)return f}
  return alts.find(a=>!/\{Arg\}/.test(a))||alts[0];
}
function speakText(es,raw){
  if(!('speechSynthesis' in window))return;
  const acc=accOf();
  const t=raw?es:clean(pickAlt(es,acc)).replace(/\.{3}|…/g,' ');
  if(!t.trim())return;
  const u=new SpeechSynthesisUtterance(t),p=pickVoice(acc);
  if(!p)noVoiceNote();
  if(p){u.voice=p.v;u.lang=p.v.lang}else u.lang=acc;
  u.rate=.85;
  try{
    const busy=speechSynthesis.speaking||speechSynthesis.pending;
    if(busy)speechSynthesis.cancel();
    // A short pause lets the audio wake up first. Without it the start of a word can be cut off.
    setTimeout(()=>{try{speechSynthesis.speak(u)}catch(e){}},busy?120:60);
  }catch(e){}
}
let nvT=null;
function noVoiceNote(){
  let n=document.getElementById('nvn');
  if(!n){n=document.createElement('div');n.id='nvn';n.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;z-index:50;padding:12px 14px;border-radius:12px;background:var(--card);border:1px solid var(--bd);color:var(--tx);font-size:14px;box-shadow:0 4px 18px rgba(0,0,0,.25)';document.body.appendChild(n)}
  n.textContent='No '+TL().n+' voice is installed on this device, so nothing can be read aloud. See Settings, Pronunciation for how to add one.';
  n.style.display='block';clearTimeout(nvT);nvT=setTimeout(()=>{n.style.display='none'},6000);
}
function speakCard(){const it=Q&&Q.queue[0];if(it)speakText(it.c.es)}
function speakId(id){const c=S.cards.find(x=>x.id===id);if(c)speakText(c.es)}
const spkBtn=fn=>'<button class="spk" onclick="'+fn+'" aria-label="Play pronunciation">'+ICO+'</button>';
function showVoices(){
  loadVoices();
  const vs=VOICES.filter(v=>vl(v).startsWith(TL().pre)),el=document.getElementById('vlist');
  if(!el)return;
  el.innerHTML=vs.length?TL().n+' voices found ('+vs.length+'):<br>'+vs.map(v=>esc(v.name+' ('+v.lang+')')).join('<br>'):'No '+TL().n+' voices found. '+(VOICES.length?'The app sees '+VOICES.length+' voices in other languages.':'The app sees no voices at all. Close the page completely and open it again.');
}
// Quiet feedback sounds made with the Web Audio API, no sound files. On by default, switch off in Settings.
let AC=null;
function tone(f,t0,dur,vol,type,f2){
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime+t0;
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+dur+0.03);
}
function sfx(ok){
  if(S.snd===false)return;
  try{
    if(!AC){const C=window.AudioContext||window.webkitAudioContext;if(!C)return;AC=new C()}
    if(AC.state==='suspended')AC.resume();
    if(ok){tone(659,0,0.16,0.07,'sine');tone(988,0.09,0.26,0.07,'sine')}
    else tone(220,0,0.28,0.06,'triangle',165);
  }catch(e){}
}
function speechCard(){
  return '<div class="card"><div class="mu" style="margin-bottom:8px">Pronunciation</div><select onchange="S.accent=this.value;save();render()">'+Object.keys(TL().acc).map(k=>{const p=pickVoice(k);return '<option value="'+k+'"'+((accOf())===k?' selected':'')+'>'+TL().acc[k].n+(p&&p.exact?'':(p?' (uses '+esc(p.v.name)+')':''))+'</option>'}).join('')+'</select>'
   +'<label style="display:flex;gap:10px;align-items:center;margin-top:10px"><input type="checkbox" style="width:auto" '+(S.auto?'checked ':'')+'onchange="S.auto=this.checked;save()"><span>Read the '+TL().n+' word aloud after each answer</span></label>'
   +'<button class="btn sec" onclick="speakText(\''+TL().test+'\',true)">Play a test sentence</button><div class="mu" style="margin-top:8px" id="vst">'+esc(voiceStatus())+'</div><button class="btn sec" onclick="showVoices()">Show the voices this app can see</button><div class="mu" id="vlist" style="margin-top:8px"></div></div>';
}
// Sync between devices through a private GitHub Gist. The token stays in this browser only and is never part of the backup.
const TK='vocab-trainer-token',SK='vocab-trainer-sync',GF='vocab-trainer.json';
let SYN={tok:'',gid:'',base:0},SY={st:'',msg:'',conf:null,busy:false,last:0},booting=false,pushT=null;
try{SYN.tok=localStorage.getItem(TK)||'';const o=JSON.parse(localStorage.getItem(SK)||'{}');SYN.gid=o.gid||'';SYN.base=o.base||0}catch(e){}
function synSave(){try{localStorage.setItem(TK,SYN.tok);localStorage.setItem(SK,JSON.stringify({gid:SYN.gid,base:SYN.base}))}catch(e){}}
// The Home Screen app can hold on to an old copy of this page. At startup it asks the server for the newest copy and offers an update.
const BUILD='202611161158';
let UPD=false;
async function checkUpdate(){
  try{
    const r=await fetch(location.href.split('#')[0].split('?')[0],{cache:'reload'});
    const m=(await r.text()).match(/const BUILD='(\d+)'/);
    if(m&&m[1]!==BUILD){UPD=true;if(!Q&&ed===null)render()}
  }catch(e){}
}
const seed=[];
migrate();
try{const q=new URLSearchParams(location.search).get('lang');if(q&&TLS[q]&&!S.cards.length&&!S.seeded){S.tl=q;if(q==='it'&&S.lists[0])S.lists[0].lang='nl'}}catch(e){}
if(!S.cards.length&&!S.seeded){seed.forEach(w=>addCard(w[0],w[1]));S.seeded=true;save()}
function save(){
  S.mod=Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  if(SYN.tok&&SYN.gid&&!SY.conf&&!booting){clearTimeout(pushT);pushT=setTimeout(()=>syncNow(false),15000)}
}
function addCard(es,de,wait){
  const c={id:Date.now()+Math.floor(Math.random()*1e6),l:S.view,es:es,de:de,sd:{p:1,due:0},ds:{p:1,due:0}};
  if(wait)c.w=true;
  S.cards.push(c);
}
// Makes sure every card belongs to a list and the selected lists exist (also upgrades older saved data).
function migrate(){
  if(!S.lists||!S.lists.length)S.lists=[{id:1,name:'My words'}];
  S.cards.forEach(c=>{if(!S.lists.some(l=>l.id===c.l))c.l=S.lists[0].id});
  S.lists.forEach(l=>{if(l.lang!=='en'&&l.lang!=='nl')l.lang='de'});
  if(!S.perDay)S.perDay=5;
  if(!S.dayb){S.dayb=true;const n=Date.now();S.cards.forEach(c=>['sd','ds'].forEach(k=>{const s=c[k];if(s&&s.p>=2&&s.due>n){const x=snapDay(s.due);if(x<s.due)s.due=Math.max(x,n)}}))}
  if(!S.packs)S.packs={};
  if(!S.lists.some(l=>l.id===S.view))S.view=S.lists[0].id;
  if(S.sel!=='all'&&!S.lists.some(l=>l.id===S.sel))S.sel='all';
}

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]));
const norm=s=>s.toLowerCase().replace(/[¿¡?!.,:…]/g,' ').replace(/\s+/g,' ').trim();
const plain=s=>norm(s).replace(/ß/g,'ss').replace(/ñ/g,'\u0001').normalize('NFD').replace(/[\u0300-\u036f]/g,'');
// 2 = exact, 1 = only accents differ (still counted correct), 0 = wrong
// A dialect tag looks like {LatAm}. It is shown in italics but never counted when checking what you typed.
// Markers like etw. / iets / algo / qualcosa are not counted. Stripping never leaves an empty answer.
const MARKS=[/\(?\b(?:etw|jdn|jdm)\b\.?(?:\/(?:etw|jdn|jdm)\b\.?)?\)?\s*/g,/\(?\b(?:iets|iemand|iem)\b\.?\)?\s*/g,/\s+(?:hacer\s+)?(?:(?:de|en|a|por)\s+)?(?:algo|alguien)\b/g,/\s+(?:a\s+)?alguien\b/g,/\s+(?:(?:di|a|da|per|su)\s+)?(?:qualcosa|qualcuno)\b/g];
const clean=s=>{let r=s.replace(/\s*\{[^}]*\}/g,'').replace(/\s+/g,' ').trim();MARKS.forEach(x=>{const q=r.replace(x,' ').replace(/\s+/g,' ').trim();if(q)r=q});return r};
const show=s=>esc(s).replace(/\{([^}]*)\}/g,'<i class="dia">$1</i>');
// A card can list several answers separated by " / ". A dialect word ({LatAm}, {Arg}) counts as a variant of the word before it.
function groups(answer){
  const g=[];
  answer.split(/\s*\/\s*/).forEach(a=>{
    const dia=/\{(?:LatAm|Arg)\}/.test(a),c=clean(a);
    if(!c)return;
    if(dia&&g.length)g[g.length-1].push(c);else g.push([c]);
  });
  return g;
}
function parts(input){const i=clean(input);return [i].concat(i.split(/\s*[\/;,]\s*/).filter(Boolean))}
function strictOn(gs){return !S.any&&gs.length>1}
function covers(fn,gs,ps,strict){
  if(!strict){const alts=gs.flat();if(alts.some(a=>fn(a)===fn(ps[0])))return true;const r=ps.slice(1);return r.length>1&&r.every(p=>alts.some(a=>fn(a)===fn(p)))}
  return gs.every(g=>g.some(a=>ps.some(p=>fn(a)===fn(p))));
}
function grade(input,answer){
  const gs=groups(answer),ps=parts(input),st=strictOn(gs);
  return covers(norm,gs,ps,st)?2:covers(plain,gs,ps,st)?1:0;
}
// Every answer on a card is typed, but at least one has a small typo
function nearAll(input,answer){
  const gs=groups(answer);if(!strictOn(gs))return false;
  const ps=parts(input).slice(1);
  const close=(a,p)=>{const x=plain(a),y=plain(p),lim=x.length>=8?2:x.length>=4?1:0;return x===y||(lim>0&&dist(x,y)<=lim)};
  return gs.every(g=>g.some(a=>ps.some(p=>close(a,p))));
}
// Typed some but not all of the answers on a card that needs all of them
function partial(input,answer){
  const gs=groups(answer);if(!strictOn(gs))return false;
  const ps=parts(input);
  return gs.some(g=>g.some(a=>ps.some(p=>plain(a)===plain(p))))&&!covers(plain,gs,ps,true);
}
function items(){
  const out=[];
  S.cards.filter(c=>!c.w&&(S.sel==='all'||c.l===S.sel)).forEach(c=>['sd','ds'].forEach(d=>{if(S.dir==='both'||S.dir===d)out.push({c:c,d:d})}));
  return out;
}
// New words wait in a queue (c.w). Each day up to S.perDay of them are released, taking turns between lists.
function today(){const d=new Date(Date.now()-ROLL*36e5);return d.getFullYear()+'/'+(d.getMonth()+1)+'/'+d.getDate()}
function releaseNew(n){
  const qs=S.lists.map(l=>S.cards.filter(c=>c.w&&c.l===l.id&&(S.sel==='all'||S.sel===l.id))).filter(q=>q.length);
  let k=0;
  while(k<n&&qs.some(q=>q.length)){
    for(const q of qs){if(k>=n)break;const c=q.shift();if(c){delete c.w;c.sd.due=0;c.ds.due=0;k++}}
  }
  return k;
}
function daily(){
  let ch=false;
  if(S.day!==today()){S.day=today();S.rel=0;ch=true}
  const n=S.perDay-(S.rel||0);
  if(n>0){const k=releaseNew(n);if(k){S.rel=(S.rel||0)+k;ch=true}}
  if(ch)save();
}
let moreN=10;
function moreGo(){const v=Math.floor(+$('#mn').value);if(!(v>0))return;moreN=v;more(v)}
function more(n){S.rel=(S.rel||0)+releaseNew(n);save();render()}
function rel(ms){const m=Math.max(1,Math.round(ms/MIN));if(m<60)return m+' min';const h=Math.round(m/60);if(h<48)return h+' h';return Math.round(h/24)+' days'}

// What goes to the cloud: everything except the pasted course text.
function snap(){const o=Object.assign({},S);delete o.courseText;return JSON.stringify(o)}
function gh(path,opt){
  opt=opt||{};
  const h={'Authorization':'Bearer '+SYN.tok,'Accept':'application/vnd.github+json'};
  if(opt.body)h['Content-Type']='application/json';
  return fetch('https://api.github.com'+path,{method:opt.method||'GET',headers:h,body:opt.body?JSON.stringify(opt.body):undefined}).then(r=>{
    if(!r.ok){const e=new Error('HTTP '+r.status);e.status=r.status;throw e}
    return r.json();
  });
}
async function fetchRemote(){
  const g=await gh('/gists/'+SYN.gid),f=g.files&&g.files[GF];
  if(!f)throw Object.assign(new Error('missing'),{status:404});
  let t=f.content;
  if(f.truncated||t==null)t=await (await fetch(f.raw_url)).text();
  const r=JSON.parse(t);
  if(!r||!r.cards)throw new Error('bad data');
  return r;
}
async function pushNow(){
  if(!S.mod)S.mod=Date.now();
  const c=snap(),m=S.mod;
  await gh('/gists/'+SYN.gid,{method:'PATCH',body:{files:{[GF]:{content:c}}}});
  SYN.base=m;synSave();
}
function applyRemote(r){
  const keep=S.courseText;
  S=r;if(keep)S.courseText=keep;
  migrate();
  S.mod=r.mod||Date.now();
  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  SYN.base=S.mod;synSave();loadCourse();render();
}
function synErr(e){
  if(e.status===401)return 'GitHub did not accept the token. Check it and connect again.';
  if(e.status===403)return 'GitHub refused the request. The token needs the gist permission, or try again in a few minutes.';
  if(e.status===404)return 'The sync notebook was not found. Disconnect and connect again.';
  if(e.name==='TypeError')return 'No connection. It will sync again when you are online.';
  return 'Something went wrong while syncing.';
}
function synUi(){
  document.querySelectorAll('.synst').forEach(el=>el.innerHTML=synStatus());
}
function synStatus(){
  if(SY.busy)return 'Syncing...';
  if(SY.st==='err')return esc(SY.msg);
  if(SY.last){const m=Math.round((Date.now()-SY.last)/MIN);return 'Synced '+(m<1?'just now':m+' min ago')}
  return 'Connected. Not synced yet.';
}
async function syncNow(manual){
  if(!SYN.tok||!SYN.gid||SY.busy||SY.conf)return;
  SY.busy=true;SY.st='';synUi();
  try{
    const r=await fetchRemote(),rm=r.mod||0,lm=S.mod||0,b=SYN.base,lc=lm>b,rc=rm>b;
    if(lc&&rc&&rm!==lm){SY.conf={r};render()}
    else if(rc&&!lc){if(manual||(!Q&&ed===null))applyRemote(r)}
    else if(lc)await pushNow();
    SY.last=Date.now();
  }catch(e){SY.st='err';SY.msg=synErr(e)}
  SY.busy=false;synUi();
}
async function connectSync(){
  const t=$('#tok').value.trim();
  if(!t)return;
  SYN.tok=t;SYN.gid='';SY.busy=true;SY.st='';SY.msg='';synUi();
  try{
    let found=null;
    for(let pg=1;pg<=5&&!found;pg++){
      const l=await gh('/gists?per_page=100&page='+pg);
      if(!l.length)break;
      found=l.find(g=>g.files&&g.files[GF]);
    }
    if(found){
      SYN.gid=found.id;
      const r=await fetchRemote();
      if((S.cards.length)&&(r.mod||0)>0){SYN.base=0;synSave();SY.conf={r}}
      else applyRemote(r);
    }else{
      if(!S.mod)S.mod=Date.now();
      const g=await gh('/gists',{method:'POST',body:{description:'Vocab trainer sync',public:false,files:{[GF]:{content:snap()}}}});
      SYN.gid=g.id;SYN.base=S.mod;synSave();
    }
    synSave();SY.last=Date.now();
  }catch(e){SYN.tok='';SYN.gid='';SY.st='err';SY.msg=synErr(e);synSave()}
  SY.busy=false;render();
}
async function resolveSync(useCloud){
  const r=SY.conf&&SY.conf.r;SY.conf=null;
  if(useCloud&&r){applyRemote(r);SY.last=Date.now();return}
  SY.busy=true;synUi();
  try{S.mod=Date.now();try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}await pushNow();SY.last=Date.now()}
  catch(e){SY.st='err';SY.msg=synErr(e)}
  SY.busy=false;render();
}
function disconnectSync(){SYN={tok:'',gid:'',base:0};SY={st:'',msg:'',conf:null,busy:false,last:0};try{localStorage.removeItem(TK);localStorage.removeItem(SK)}catch(e){}render()}
function conflictCard(){
  return '<div class="card"><b>Two versions found</b><div class="mu" style="margin:6px 0 10px">Your progress changed on this device and in the cloud. Choose which one to keep. The other one is replaced.</div><button class="btn" onclick="resolveSync(true)">Keep the cloud version</button><button class="btn sec" onclick="resolveSync(false)">Keep this device</button></div>';
}
function syncCard(){
  const on=SYN.tok&&SYN.gid;
  if(SY.conf)return conflictCard();
  if(on)return '<div class="card"><div class="mu" style="margin-bottom:6px">Sync between devices</div><div class="mu synst" style="margin-bottom:8px;color:var(--tx)">'+synStatus()+'</div><button class="btn sec" onclick="syncNow(true)">Sync now</button><button class="btn sec" style="color:var(--bad);border-color:var(--bad)" onclick="disconnectSync()">Disconnect this device</button><div class="mu" style="margin-top:8px">Disconnecting keeps your progress on this device and in the cloud. The pasted course text is not synced, so paste it again on a new device if you want to add more packs.</div></div>';
  return '<div class="card"><div class="mu" style="margin-bottom:6px">Sync between devices</div><div class="mu" style="margin-bottom:8px">Your progress is saved in an unlisted file (a Gist) in your own GitHub account. Only people with its long web address could see it. Do this once on each device:</div>'
   +'<div class="mu" style="margin-bottom:8px">1. <a href="https://github.com/settings/tokens/new?scopes=gist&description=Vocab%20trainer" target="_blank" rel="noopener" style="color:var(--ac)">Open this GitHub page</a> and sign in.<br>2. Set Expiration to No expiration. The gist box is already ticked, leave everything else off.<br>3. Scroll down, tap Generate token, copy the token.<br>4. Paste it below and tap Connect.</div>'
   +'<input id="tok" type="password" placeholder="Paste your token here" autocapitalize="off" autocorrect="off" autocomplete="off" spellcheck="false"><button class="btn" onclick="connectSync()">Connect</button><div class="mu synst" style="margin-top:8px">'+(SY.busy?'Connecting...':SY.st==='err'?esc(SY.msg):'')+'</div></div>';
}
function forecastCard(it,now,wt){
  const eod=dueIn(1),eot=dueIn(2),e6=dueIn(7);
  const a=[0,0,0];
  it.forEach(x=>{const t=x.c[x.d].due;if(t<=now)return;if(t<eod)a[0]++;else if(t<eot)a[1]++;else if(t<e6)a[2]++});
  const nt=Math.min(S.perDay,wt),row=(l,v)=>'<div class="row" style="justify-content:space-between;padding:5px 0"><span class="mu">'+l+'</span><b>'+v+'</b></div>';
  return '<div class="card"><div class="mu" style="margin-bottom:4px">Coming up</div>'+row('Later today',a[0]+' reviews')+row('Tomorrow',a[1]+' reviews')+row('New words tomorrow',nt)+row('In 2 to 6 days',a[2]+' reviews')+'<div class="mu" style="margin-top:6px">Reviews count each direction separately. Cards you get wrong come back sooner.</div></div>';
}

function start(){
  const now=Date.now();
  const l=items().filter(x=>x.c[x.d].due<=now);
  for(let i=l.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[l[i],l[j]]=[l[j],l[i]]}
  const q=l.slice(0,20).map(x=>({c:x.c,d:x.d,retry:false}));
  Q={queue:q,total:q.length,done:0,right:0,st:'ask',g:0,val:''};
  render();
}

function keysRow(id){
  return '<div class="keys">'+TL().keys.split(' ').map(k=>'<button onpointerdown="ins(event,\''+id+'\',\''+k+'\')">'+k+'</button>').join('')+'</div>';

function ins(e,id,ch){
  e.preventDefault();
  const el=$('#'+id);if(!el)return;
  const a=el.selectionStart,b=el.selectionEnd;
  el.value=el.value.slice(0,a)+ch+el.value.slice(b);
  el.setSelectionRange(a+1,a+1);el.focus();
}
function answerOf(it){return it.d==='sd'?it.c.de:it.c.es}
// Edit distance: how many single letter changes turn a into b.
function dist(a,b){
  const m=a.length,n=b.length;let p=[];for(let j=0;j<=n;j++)p[j]=j;
  for(let i=1;i<=m;i++){const c=[i];for(let j=1;j<=n;j++)c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}
  return p[n];
}
// A near miss is a likely typo: 1 letter off for words of 4+ letters, 2 letters off for 8+ letters.
function near(v,answer){
  return clean(answer).split(/\s*[\/;]\s*/).some(a=>{
    const x=plain(a),y=plain(v),lim=x.length>=8?2:x.length>=4?1:0;
    return lim>0&&dist(x,y)<=lim;
  });
}
function check(){
  const it=Q.queue[0],v=$('#ans').value;
  if(!v.trim())return;
  Q.val=v;Q.g=grade(v,answerOf(it));
  if(!Q.g&&!Q.tried&&nearAll(v,answerOf(it))){Q.tried=true;Q.hint='spell';render();return}
  if(!Q.g&&!Q.tried&&partial(v,answerOf(it))){Q.tried=true;Q.hint='more';render();return}
  if(!Q.g&&!Q.tried&&near(v,answerOf(it))){Q.tried=true;Q.hint='spell';render();return}
  Q.hint=false;
  sfx(Q.g);
  if(S.auto)speakText(it.c.es);
  if(!it.retry){
    const s=it.c[it.d];
    Q.prev={p:s.p,due:s.due};
    if(Q.g){
      promote(s);
      Q.right++;
    }else{s.p=1;s.due=Date.now()+INT[1]}
    if(countAnswer())Q.goalMsg=true;
    save();
  }
  Q.st=Q.g?'ok':'bad';render();
}
function promote(s){if(s.p<6){s.p++;s.due=dueIn(DAYS[s.p])}else s.due=dueIn(90)}
// Every list has its own second language. The card text field is still called de, but it holds that language.
const LN={de:'Deutsch',en:'English',nl:'Nederlands'};
function curList(){return S.lists.find(x=>x.id===S.view)}
function lname(c){const l=S.lists.find(x=>x.id===c.l);return LN[l&&l.lang||'de']}
function optLang(v){return Object.keys(LN).map(k=>'<option value="'+k+'"'+(v===k?' selected':'')+'>'+LN[k]+'</option>').join('')}
function setLang(v){curList().lang=v;save();render()}
// Undo the wrong mark: restore the card's old phase, then count the answer as correct.
function override(){
  const it=Q.queue[0];
  if(!it.retry&&Q.prev){const s=it.c[it.d];s.p=Q.prev.p;s.due=Q.prev.due;promote(s);Q.right++;save()}
  sfx(true);
  Q.st='ok';next();
}
function confirmRe(){
  const it=Q.queue[0],v=$('#re').value;
  if(grade(v,answerOf(it)))next();
  else{$('#re').value='';$('#re').placeholder='Look again and type it exactly';$('#re').focus()}
}
function next(){
  const it=Q.queue.shift();
  if(Q.st==='bad'&&!it.retry)Q.queue.splice(Math.min(4,Q.queue.length),0,{c:it.c,d:it.d,retry:true});
  if(!(Q.st==='bad'&&!it.retry))Q.done++;
  Q.st='ask';Q.goalMsg=false;Q.tried=false;Q.hint=false;Q.val='';render();
  if(!Q.queue.length&&SYN.tok&&SYN.gid){clearTimeout(pushT);setTimeout(()=>syncNow(false),300)}
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter'||tab!=='learn'||!Q||!Q.queue.length)return;
  if(Q.st==='ask')check();else if(Q.st==='ok')next();else confirmRe();
});

// The course words are not part of this page. They are pasted in once on the Course tab and stored in this browser only.
// Format: "# Unit name", then "## Section name", then lines like "Spanish ; German" (or "Italian ; Dutch").
let COURSE=[];
function parseCourse(t){
  const us=[];let u=null,sec=null;
  String(t||'').split('\n').forEach(raw=>{
    const line=raw.trim();if(!line)return;
    if(line.startsWith('## ')){if(!u){u={u:'Course',s:[]};us.push(u)}sec=[line.slice(3).trim(),[]];u.s.push(sec);return}
    if(line.startsWith('# ')){u={u:line.slice(2).trim(),s:[]};us.push(u);sec=null;return}
    const q=line.split(/\s*;\s*/);
    if(q.length<2||!q[0]||!q[1])return;
    if(!u){u={u:'Course',s:[]};us.push(u)}
    if(!sec){sec=['Words',[]];u.s.push(sec)}
    sec[1].push(q[0]+' ; '+q[1]);
  });
  return us.map(x=>({u:x.u,s:x.s.filter(y=>y[1].length).map(y=>[y[0],y[1].join('\n')])})).filter(x=>x.s.length);
}
function loadCourse(){COURSE=parseCourse(S.courseText)}
function saveCourse(){
  const t=$('#ctext').value;
  if(!parseCourse(t).length){$('#cmsg').textContent='No words found. Each line needs the form: '+TL().n+' ; translation';return}
  S.courseText=t;loadCourse();save();render();
}
function serializeCourse(us){return us.map(u=>'# '+u.u+'\n'+u.s.map(x=>'## '+x[0]+'\n'+x[1]).join('\n')).join('\n')+'\n'}
function addCourse(){
  const t=$('#ctext').value,nu=parseCourse(t);
  if(!nu.length){$('#cmsg').textContent='No words found. Each line needs the form: '+TL().n+' ; translation';return}
  const have=new Set(COURSE.map(u=>u.u)),add=nu.filter(u=>!have.has(u.u)),skip=nu.length-add.length;
  if(!add.length){$('#cmsg').textContent='Nothing added. All '+nu.length+' units are already in your course.';return}
  S.courseText=(S.courseText?S.courseText.replace(/\s*$/,'\n'):'')+serializeCourse(add);
  loadCourse();save();render();
  $('#cmsg').textContent=add.length+' units added'+(skip?', '+skip+' skipped because they already exist':'')+'.';
}
function removeCourse(){S.courseText='';loadCourse();save();render()}
// Cut a unit into packs of 20 words and remember which sections each pack covers.
function packs(u){
  const w=[];u.s.forEach(x=>x[1].trim().split('\n').forEach(l=>w.push([x[0],l.trim()])));
  // Packs hold about 20 words each. The words are spread evenly, so there is never a tiny leftover pack.
  const k=Math.max(1,Math.round(w.length/20)),out=[];let a=0;
  for(let i=0;i<k;i++){const b=Math.round((i+1)*w.length/k),c=w.slice(a,b);a=b;out.push({lines:c.map(x=>x[1]),secs:[...new Set(c.map(x=>x[0]))]})}
  return out;
}
function packDone(pid){return S.packs[pid]&&S.lists.some(l=>l.id===S.packs[pid])}
// Adding a pack creates a list. Its words wait in the queue. Words you already have are skipped.
function addPack(ui,pi){
  const u=COURSE[ui],p=packs(u)[pi],pid=u.u+' Pack '+(pi+1);
  if(packDone(pid))return;
  const have=new Set(S.cards.map(c=>clean(c.es).toLowerCase()));
  const id=Date.now()+ui*50+pi,old=S.view;
  S.lists.push({id:id,name:pid,lang:defLang()});S.view=id;
  p.lines.forEach(l=>{const q=l.split(/\s*;\s*/);if(q.length>=2&&!have.has(clean(q[0]).toLowerCase()))addCard(q[0].trim(),q[1].trim(),true)});
  S.view=old;S.packs[pid]=id;save();render();
}
function defLang(){return (S.tl||'es')==='it'?'nl':'de'}
// Add one single word from a pack preview. Picked words go into their own list, "Picked words", and are available right away.
function addWord(ui,pi,wi){
  const l=packs(COURSE[ui])[pi].lines[wi],q=l.split(/\s*;\s*/);
  if(q.length<2)return;
  if(S.cards.some(c=>clean(c.es).toLowerCase()===clean(q[0]).toLowerCase()))return;
  let pl=S.lists.find(x=>x.id===S.pickList);
  if(!pl){pl={id:Date.now(),name:'Picked words',lang:defLang()};S.lists.push(pl);S.pickList=pl.id}
  const old=S.view;S.view=pl.id;addCard(q[0].trim(),q[1].trim());S.view=old;
  save();render();
}
function nextPack(){
  for(let ui=0;ui<COURSE.length;ui++){const ps=packs(COURSE[ui]);for(let pi=0;pi<ps.length;pi++){if(!packDone(COURSE[ui].u+' Pack '+(pi+1))){addPack(ui,pi);return}}}
}

function courseView(){
  const box='<textarea id="ctext" style="min-height:150px" placeholder="Paste the course text here" autocapitalize="off" autocorrect="off" spellcheck="false"></textarea>';
  if(!COURSE.length)return '<h1>Course</h1><div class="card"><div class="mu" style="margin-bottom:10px">The course words are not part of this page. Paste your course text here once. It stays in this browser on this device.</div>'+box+'<button class="btn" onclick="saveCourse()">Save course text</button><div id="cmsg" class="mu" style="margin-top:8px"></div></div>';
  let n=0,pk=0;COURSE.forEach(u=>{const ps=packs(u);pk+=ps.length;ps.forEach(p=>n+=p.lines.length)});
  let h='<h1>Course</h1><div class="mu" style="margin-bottom:12px">'+n+' words in '+pk+' packs of about 20 words. Tap Add and the pack becomes a list. Its words wait in the queue and arrive at your daily pace. Tap Preview to add single words.</div><button class="btn" style="margin:0 0 14px" onclick="nextPack()">Add the next pack</button>';
  COURSE.forEach((u,ui)=>{
    h+='<div class="card"><b>'+esc(u.u)+'</b>';
    packs(u).forEach((p,pi)=>{
      const done=packDone(u.u+' Pack '+(pi+1)),id=ui+'-'+pi,open=cpv===id;
      h+='<div class="w"><div>Pack '+(pi+1)+'<div class="mu">'+esc(p.secs.join(', '))+' · '+p.lines.length+' words</div></div><div style="white-space:nowrap"><button class="e" style="font-size:16px" onclick="cpv=\''+(open?'':id)+'\';render()">'+(open?'Hide':'Preview')+'</button> '+(done?'<span class="mu">Added</span>':'<button class="e" style="font-size:16px" onclick="addPack('+ui+','+pi+')">Add</button>')+'</div></div>';
      if(open){const have=new Set(S.cards.map(c=>clean(c.es).toLowerCase()));h+='<div style="padding:2px 0 10px">'+p.lines.map((l,wi)=>{const q=l.split(/\s*;\s*/),got=have.has(clean(q[0]).toLowerCase());return '<div class="w" style="padding:6px 0;align-items:center"><div><b>'+show(q[0])+'</b><div class="mu">'+show(q[1])+'</div></div><div style="white-space:nowrap">'+(got?'<span class="mu">Added</span>':'<button class="e" style="font-size:16px" onclick="addWord('+ui+','+pi+','+wi+')">Add</button>')+'</div></div>'}).join('')+'</div>'}
    });
    h+='</div>';
  });
  h+='<div class="card"><div class="mu" style="margin-bottom:8px">Add more course text, or replace it. Lists you already added stay as they are.</div>'+box+'<button class="btn" onclick="addCourse()">Add to course text</button><button class="btn sec" onclick="saveCourse()">Replace course text</button><button class="btn sec" style="color:var(--bad);border-color:var(--bad)" onclick="removeCourse()">Remove course text</button><div id="cmsg" class="mu" style="margin-top:8px"></div></div>';
  return h;
}

function gparse(line){
  const q=line.split('|'),o={inf:q[0],en:q[1],de:q[2],f:{}};
  (q[3]||'').split(' ').filter(Boolean).forEach(t=>{const i=t.indexOf('=');if(i<0)o.f[t]=true;else o.f[t.slice(0,i)]=t.slice(i+1)});
  return o;
}
const GACC={a:'á',e:'é',i:'í',o:'ó',u:'ú'};
function gacc(s){for(let i=s.length-1;i>=0;i--){if(GACC[s[i]])return s.slice(0,i)+GACC[s[i]]+s.slice(i+1)}return s}
// stem change: ie, ue, i
function gchg(s,k){
  if(k==='ie'){let i=s.lastIndexOf('e');if(i<0)i=s.lastIndexOf('i');return s.slice(0,i)+'ie'+s.slice(i+1)}
  if(k==='ue'){let i=s.lastIndexOf('o');if(i<0)i=s.lastIndexOf('u');const r=s.slice(0,i)+'ue'+s.slice(i+1);return r.startsWith('ue')?'h'+r:r}
  if(k==='i'){const i=s.lastIndexOf('e');return s.slice(0,i)+'i'+s.slice(i+1)}
  return s;
}
// second stem change used in -ir verbs (pidió, durmió, sintiendo, durmamos)
function gchg2(s,k){
  if(k==='ie'||k==='i'){const i=s.lastIndexOf('e');return i<0?s:s.slice(0,i)+'i'+s.slice(i+1)}
  if(k==='ue'){const i=s.lastIndexOf('o');return i<0?s:s.slice(0,i)+'u'+s.slice(i+1)}
  return s;
}
// join a stem and an ending, with the usual spelling changes (c to qu, g to j, ...)
function gjoin(st,e,V){
  const c=e[0];
  if(V.type==='ar'&&(c==='e'||c==='é')){
    if(V.inf2.endsWith('guar')&&st.endsWith('gu'))st=st.slice(0,-1)+'ü';
    else if(st.endsWith('c'))st=st.slice(0,-1)+'qu';
    else if(st.endsWith('g'))st=st+'u';
    else if(st.endsWith('z'))st=st.slice(0,-1)+'c';
  }else if(V.type!=='ar'&&(c==='a'||c==='o'||c==='á'||c==='ó')){
    if(V.inf2.endsWith('guir')&&st.endsWith('gu'))st=st.slice(0,-1);
    else if(st.endsWith('g')&&/(ger|gir)$/.test(V.inf2))st=st.slice(0,-1)+'j';
    else if(st.endsWith('c')&&/[^aeiou]c(er|ir)$/.test(V.inf2))st=st.slice(0,-1)+'z';
  }
  return st+e;
}
function gseSwap(w){return w.replace(/ramos$/,'semos').replace(/rais$/,'seis').replace(/ras$/,'ses').replace(/ran$/,'sen').replace(/ra$/,'se')}

function gconj(v){
  const f=v.f,refl=/se$/.test(v.inf),base=refl?v.inf.slice(0,-2):v.inf,inf2=base.replace(/í/g,'i'),type=inf2.slice(-2),stem=inf2.slice(0,-2),V={type,inf2};
  const uy=type==='ir'&&/[^gq]uir$/.test(inf2);
  const vst=type!=='ar'&&(/[aeo]$/.test(stem)||uy);
  const sc=f.ie?'ie':f.ue?'ue':f.i?'i':f.iep?'ie':null;
  const sc2=type==='ir'&&sc&&!f.iep;
  const mid=[0,1,2,5];
  // present
  const PE={ar:['o','as','a','amos','áis','an'],er:['o','es','e','emos','éis','en'],ir:['o','es','e','imos','ís','en']}[type];
  let pres;
  if(f.pres)pres=f.pres.split(',');
  else pres=PE.map((e,p)=>{
    if(p===0&&f.yo)return f.yo;
    let s=stem;
    if(mid.includes(p)){
      if(sc)s=gchg(s,sc);
      if(f.ia||f.ua)s=gacc(s);
      if(uy)s+='y';
    }
    if(p===0&&type!=='ar'&&!sc&&/[aeiou]c$/.test(stem))return stem.slice(0,-1)+'zco';
    return gjoin(s,e,V);
  });
  // preterite
  let pret;
  if(f.pret)pret=f.pret.split(',');
  else if(f.ps){
    const ps=f.ps,ends=['e','iste','o','imos','isteis',ps.endsWith('j')?'eron':'ieron'];
    pret=ends.map(e=>(ps==='hic'&&e==='o'?'hiz':ps)+e);
  }else if(type==='ar'){
    pret=['é','aste','ó','amos','asteis','aron'].map(e=>gjoin(stem,e,V));
  }else if(uy){
    pret=['í','iste','yó','imos','isteis','yeron'].map(e=>stem+e);
  }else if(vst){
    pret=['í','íste','yó','ímos','ísteis','yeron'].map(e=>stem+e);
  }else{
    pret=['í','iste','ió','imos','isteis','ieron'].map((e,p)=>(sc2&&(p===2||p===5)?gchg2(stem,sc):stem)+e);
  }
  // imperfect
  const impf=f.impf?f.impf.split(','):(type==='ar'?['aba','abas','aba','ábamos','abais','aban'].map(e=>stem+e):['ía','ías','ía','íamos','íais','ían'].map(e=>(f.is||stem)+e));
  // future and conditional
  const fs=f.fut||inf2;
  const fut=['é','ás','á','emos','éis','án'].map(e=>fs+e);
  const cond=['ía','ías','ía','íamos','íais','ían'].map(e=>fs+e);
  // participle and gerund
  const part=f.part||(vst?(uy?stem+'ido':stem+'ído'):stem+(type==='ar'?'ado':'ido'));
  const ger=f.ger||(type==='ar'?stem+'ando':vst?stem+'yendo':(type==='ir'&&sc?gchg2(stem,sc):stem)+'iendo');
  // subjunctive present
  let sprs;
  if(f.subj)sprs=f.subj.split(',');
  else{
    const SE=type==='ar'?['e','es','e','emos','éis','en']:['a','as','a','amos','áis','an'];
    const ys=f.ss||pres[0].slice(0,-1);
    sprs=SE.map((e,p)=>{
      let s=ys;
      if(p===3||p===4){
        if(f.ss)s=f.ss;
        else if(f.ia||f.ua)s=stem;
        else if(f.yo)s=ys;
        else if(sc2)s=gchg2(stem,sc);
        else if(sc)s=stem;
        else s=ys;
      }
      return gjoin(s,e,V);
    });
  }
  // imperfect subjunctive (-ra forms)
  const b=pret[5].slice(0,-3);
  const simp=[b+'ra',b+'ras',b+'ra',gacc(b)+'ramos',b+'rais',b+'ran'];
  const T={pres,pret,impf,fut,cond,sprs,simp};
  T.perf=GAUX.pres.map(a=>a+' '+part);
  T.plusc=GAUX.impf.map(a=>a+' '+part);
  T.futperf=GAUX.fut.map(a=>a+' '+part);
  T.condperf=GAUX.cond.map(a=>a+' '+part);
  T.sperf=GAUX.sprs.map(a=>a+' '+part);
  T.splus=GAUX.simp.map(a=>a+' '+part);
  T.impa=[f.tu||pres[2],sprs[2],f.nos||sprs[3],base.slice(0,-1)+'d',sprs[5]];
  T.impn=[1,2,3,4,5].map(i=>'no '+sprs[i]);
  if(refl){
    ['pres','pret','impf','fut','cond','sprs','simp','perf','plusc','futperf','condperf','sperf','splus'].forEach(k=>T[k]=T[k].map((x,p)=>GRP[p]+' '+x));
    T.impn=[1,2,3,4,5].map(i=>'no '+GRP[i]+' '+sprs[i]);
    T.impa=null;
  }
  return {inf:v.inf,part,ger,T};
}

GV_RAW.split('\n').forEach(l=>{const v=gparse(l);GV.push(v);GVM[v.inf]=v});

// any typed infinitive: known verb or a regular guess
function gfind(s){
  s=(s||'').trim().toLowerCase();
  if(GVM[s])return {v:GVM[s],known:true};
  if(/^[a-zñáéíóúü]{2,}(ar|er|ir|ír)(se)?$/.test(s))return {v:{inf:s,en:'',de:'',f:{},irr:false,refl:/se$/.test(s)},known:false};
  return null;
}
function gplain(s){return s.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ñ/g,'n')}

}
function gModel(tk,vs){

}
